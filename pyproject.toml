[project]
name = "microcosm-workspace"
version = "0.0.0"
description = "Workspace root for the microcosm stack (not a published package)"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
# openpyxl parses the OMB CBSA delineation workbook and NISRA's published
# DZ2021-to-PARLCON24 lookup in the US and UK ladder builders.
dev = ["ruff>=0.8", "openpyxl>=3.1"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# microcosm#456 (#447): the release tool bounds BLAS/torch thread-pool env
# defaults before numpy/torch load, which requires statements above the
# import block.
"tools/build_us_fiscal_refresh_release.py" = ["E402"]
# The native-scale lane's measurement harnesses are committed byte-identical to
# what ran, so that the numbers they produced are re-derivable. They import
# every us_runtime module the measured path loads -- including ones no wrapper
# names -- because the stray-module assertion beneath the import block proves
# each one resolves under the measured source tree and not under an editable
# install. Removing the "unused" import would weaken that check and would make
# the committed copy differ from the one that ran.
"experiments/native-scale-transport/harness19_base.py" = ["F401"]
"experiments/native-scale-transport/harness19_tenth.py" = ["F401"]
"experiments/native-scale-transport/harness19_after_with_required_replay.py" = ["F401"]
# The retention lane's 1/15 harness is that lane's harness19_tenth.py with three
# named changes and is committed byte-identical to what ran, for the same reason.
"experiments/native-retention-seal/harness19_fifteenth.py" = ["F401"]

[tool.ruff.lint.isort]
# microcosm is a PEP 420 namespace package (no top-level __init__.py), so
# first-party detection cannot infer it from the src layout.
known-first-party = ["microcosm"]

[tool.pytest.ini_options]
testpaths = ["packages"]
# importlib mode lets shards share test-file basenames (each has its own
# test_compat.py) without the prepend-mode rootdir collision.
addopts = "-q --import-mode=importlib"
# Build tests share named fixture helpers across CI shards. This test-only
# path also works for installed-wheel runs without exposing any package/src.
pythonpath = ["packages/microcosm-build/tests"]
markers = [
    "slow: end-to-end tests that require large local source artifacts",
    "requires_us: needs policyengine-us (the us extra); auto-skipped when absent",
    "requires_uk: needs policyengine-uk (the uk extra); auto-skipped when absent",
]
