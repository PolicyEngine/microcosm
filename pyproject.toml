[project]
name = "populace-workspace"
version = "0.0.0"
description = "Workspace root for the populace stack (not a published package)"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
# openpyxl parses the OMB CBSA delineation workbook in
# tools/build_us_block_ladder_artifact.py.
dev = ["ruff>=0.8", "openpyxl>=3.1"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# populace#456 (#447): the release tool bounds BLAS/torch thread-pool env
# defaults before numpy/torch load, which requires statements above the
# import block.
"tools/build_us_fiscal_refresh_release.py" = ["E402"]

[tool.ruff.lint.isort]
# populace is a PEP 420 namespace package (no top-level __init__.py), so
# first-party detection cannot infer it from the src layout.
known-first-party = ["populace"]

[tool.pytest.ini_options]
testpaths = ["packages"]
# importlib mode lets shards share test-file basenames (each has its own
# test_compat.py) without the prepend-mode rootdir collision.
addopts = "-q --import-mode=importlib"
markers = [
    "slow: end-to-end tests that require large local source artifacts",
]
