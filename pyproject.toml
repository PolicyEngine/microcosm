[project]
name = "populace-workspace"
version = "0.0.0"
description = "Workspace root for the populace stack (not a published package)"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.ruff]
line-length = 88
target-version = "py313"
# Provenance snapshots (packages/*/build) are verbatim audit copies of the
# scripts that produced published artifacts — linting them would force edits
# that defeat the point of a snapshot.
extend-exclude = ["packages/*/build"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# populace is a PEP 420 namespace package (no top-level __init__.py), so
# first-party detection cannot infer it from the src layout.
known-first-party = ["populace"]

[tool.pytest.ini_options]
testpaths = ["packages"]
# importlib mode lets shards share test-file basenames (each has its own
# test_compat.py) without the prepend-mode rootdir collision.
addopts = "-q --import-mode=importlib"
