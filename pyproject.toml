[project]
name = "microcosm-workspace"
version = "0.0.0"
description = "Workspace root for the microcosm stack (not a published package)"
requires-python = ">=3.13"

[tool.uv]
# microcosm#1086 (option 2, ruled 2026-10-07): each country keeps its own
# policyengine-core pin. Nothing imports both engines and CI installs one
# country extra per job, so every extra that installs policyengine-us
# conflicts with every extra that installs policyengine-uk, and uv locks the
# two sides in separate forks.
conflicts = [
    [{ package = "microcosm-build", extra = "us" }, { package = "microcosm-build", extra = "uk" }],
    [{ package = "microcosm-build", extra = "us" }, { package = "microcosm-data", extra = "uk" }],
    [{ package = "microcosm-build", extra = "us" }, { package = "microcosm-frame", extra = "uk" }],
    [{ package = "microcosm-data", extra = "us" }, { package = "microcosm-build", extra = "uk" }],
    [{ package = "microcosm-data", extra = "us" }, { package = "microcosm-data", extra = "uk" }],
    [{ package = "microcosm-data", extra = "us" }, { package = "microcosm-frame", extra = "uk" }],
    [{ package = "microcosm-frame", extra = "policyengine" }, { package = "microcosm-build", extra = "uk" }],
    [{ package = "microcosm-frame", extra = "policyengine" }, { package = "microcosm-data", extra = "uk" }],
    [{ package = "microcosm-frame", extra = "policyengine" }, { package = "microcosm-frame", extra = "uk" }],
]

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
# openpyxl parses the OMB CBSA delineation workbook and NISRA's published
# DZ2021-to-PARLCON24 lookup in the US and UK ladder builders.
dev = ["ruff>=0.8", "openpyxl>=3.1", "pytest-xdist>=3.8"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "TID251"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Builds reach Hugging Face and the collector only through the separately
# installed emitter, started through microcosm-emitter-interface. The modules
# that may still import huggingface_hub are listed under per-file-ignores
# below with the exception that covers them.
"huggingface_hub".msg = "Hand files to the emitter through microcosm-emitter-interface; only the modules listed under TID251 in pyproject.toml read or write Hugging Face directly."

[tool.ruff.lint.per-file-ignores]
# TID251, huggingface_hub outside the emitter. Datasets and the release
# metadata that selects and verifies them: the loader, the publisher's
# listing of the repository (its parent and annual base checks, and its
# refusal of any latest*.json pointer file in the repository), a UK
# national build's reference build and releases.json (run_uk_cut.py also
# fetches its build inputs), the policyengine.py certification, the US
# recertification and the quick-start notebook. release.py's Hub error checks
# (missing_on_hub, never_cached_offline), which the loader's releases.json
# read uses, also import it.
"packages/microcosm-data/src/microcosm/data/loader.py" = ["TID251"]
"packages/microcosm-data/src/microcosm/data/release.py" = ["TID251"]
"packages/microcosm-build/src/microcosm/build/release_publication.py" = ["TID251"]
"packages/microcosm-build/src/microcosm/build/uk_runtime/cut_reference.py" = ["TID251"]
"tools/run_uk_cut.py" = ["TID251"]
"tools/certify_uk_cut_in_policyengine_py.py" = ["TID251"]
"tools/build_us_compatibility_recertification.py" = ["TID251"]
"examples/quickstart_us.ipynb" = ["TID251"]
# TID251. Build inputs.
"packages/microcosm-build/src/microcosm/build/us_runtime/asec_sources.py" = ["TID251"]
"packages/microcosm-build/src/microcosm/build/us_runtime/sipp_financial_assets.py" = ["TID251"]
"tools/modal_us_stage.py" = ["TID251"]
"tools/modal_rebuild_uk_chronicle_artifact.py" = ["TID251"]
"tools/build_uk_efrs_parity_reference.py" = ["TID251"]
"tools/build_uk_release_input_coverage_manifest.py" = ["TID251"]
"experiments/**" = ["TID251"]
# TID251. Operator tools with the operator's own token: the UK staging
# repository's provisioning, and fetching a staged UK bundle.
"tools/provision_uk_staging_repository.py" = ["TID251"]
"tools/fetch_uk_staged_dataset.py" = ["TID251"]
"packages/microcosm-build/src/microcosm/build/staging_storage.py" = ["TID251"]
# TID251. The build-folder switch, which substage 5b removes.
"packages/microcosm-build/src/microcosm/build/build_folder_switch.py" = ["TID251"]
# TID251. Tests and their stand-ins for the Hub (the root conftest.py only).
"packages/*/tests/**" = ["TID251"]
"test_support/**" = ["TID251"]
"./conftest.py" = ["TID251"]
# microcosm#456 (#447): the release tool bounds BLAS/torch thread-pool env
# defaults before numpy/torch load, which requires statements above the
# import block.
"tools/build_us_fiscal_refresh_release.py" = ["E402"]
# The base, ACS staging and ACS local-release commands apply the thread
# setting before numpy loads (tools/us_build_thread_environment.py), for the
# same reason.
"tools/build_us_puf_support_base.py" = ["E402"]
"tools/build_us_acs_multispine_base.py" = ["E402"]
"tools/_legacy/build_us_acs_multispine_base.py" = ["E402"]
"tools/build_us_acs_local_release.py" = ["E402"]
# Evidence scripts are frozen receipts of one-off measurements: formatted and
# import-sorted, but their logic stays exactly as it produced the committed
# outputs, so style rules that would edit that logic are waived.
"docs/evidence/*/scripts/*.py" = ["B023", "B905", "E402", "E731", "N806"]

[tool.ruff.lint.isort]
# microcosm is a PEP 420 namespace package (no top-level __init__.py), so
# first-party detection cannot infer it from the src layout.
known-first-party = ["microcosm"]

[tool.pytest.ini_options]
testpaths = ["packages"]
# importlib mode lets shards share test-file basenames (each has its own
# test_compat.py) without the prepend-mode rootdir collision.
addopts = "-q --import-mode=importlib"
markers = [
    "slow: end-to-end tests that require large local source artifacts",
    "requires_us: needs policyengine-us (the us extra); auto-skipped when absent",
    "requires_uk: needs policyengine-uk (the uk extra); auto-skipped when absent",
    "integration: requires explicit --run-integration collection",
    "committed_gate_key_registry: run against the committed UK gate signing key registry, not the test-key admission",
]
