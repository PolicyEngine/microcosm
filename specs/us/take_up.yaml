# DRAFT (v3) — pseudocode until schemas land. Orthogonal ownership ×
# ordered typed pipeline steps (round 2 killed the eight-value treatment
# enum: it mixed ownership, mechanism, invocation grouping, policy
# interaction, and an untyped escape hatch). All 13 REAL contract
# programs committed — no ellipsis rows (sol r2 enumerated the actual
# mechanisms; wic/social_security were never contract programs).
#
# Column/entity mapping derives from engine_abi.lock.json (generated from
# the single engine pin, committed, reviewed; engine bumps fail closed) —
# NOT from a suffix naming rule (takes_up_eitc / takes_up_dc_ptc break it).
# The mapping carries a total-and-injective assertion.
status: draft-v3-pseudocode
programs:
  - id: snap
    ownership: modeled
    pipeline:
      - {kind: probability_seed, kernel: kernel:take_up_seed_national,
         rate_source: source:take_up_reported_anchor}
      - {kind: count_calibration, kernel: kernel:snap_state_take_up,
         targets: source:fns_state_participation_counts,
         domain: eligible_only, assignment: unmasked_stable_source_id,
         prior: runtime_target_over_weighted_modeled_eligibles,
         saturation: cap_at_universe}
    final_owner_stage: count_calibration
  - id: tanf
    ownership: modeled
    pipeline: [{kind: probability_seed, kernel: kernel:take_up_seed_batched,
                rate_source: contract:administrative_rate}]
    dependence: {group: generic_seeder_batch}
  - id: eitc
    ownership: modeled
    pipeline: [{kind: probability_seed, kernel: kernel:take_up_seed_batched,
                rate_source: contract:rate_by_approximated_qualifying_children}]
    dependence: {group: generic_seeder_batch}
  - id: medicaid
    ownership: modeled
    pipeline:
      - {kind: probability_seed, rate_source: source:reported_anchor}
      - {kind: count_calibration, kernel: kernel:medicaid_state_take_up,
         targets: source:state_counts, prior: runtime_state_prior,
         method: greedy_state_count}
    final_owner_stage: count_calibration
  - id: chip
    ownership: engine
    pipeline: [{kind: engine_default, debt: source_follow_up_open}]
  - id: basic_health_program
    ownership: engine
    pipeline: [{kind: engine_default, debt: source_follow_up_open}]
  - id: dc_ptc
    ownership: engine
    pipeline: [{kind: engine_default, debt: source_follow_up_open}]
  - id: early_head_start
    ownership: engine
    pipeline: [{kind: engine_default, debt: source_follow_up_open}]
  - id: medicare
    ownership: measured
    pipeline: [{kind: measured_map, source_column: asec:MCARE,
                propagation: support_clones}]
  - id: ssi
    ownership: modeled
    pipeline:                       # never count-matches flags — typed as
      - {kind: probability_seed,    # target-derived banded seed + gate
         rate_source: derived:age_band_targets_over_modeled_eligibles}
      - {kind: delivery_gate, gate: delivered_recipients}
    final_owner_stage: delivery_gate
  - id: head_start
    ownership: transferred
    pipeline: [{kind: imputed_transfer, training: source:sipp_direct_response,
                model: regime_gated_qrf}]
  - id: housing_assistance
    ownership: mixed                # row-scope segments, not one whole-column
    segments:                       # treatment (measured ASEC rows; imputed
      - {row_scope: asec_rows, ownership: measured,        # PUF support)
         pipeline: [{kind: measured_map, source_column: asec:housing_receipt}]}
      - {row_scope: puf_support_rows, ownership: transferred,
         pipeline: [{kind: imputed_transfer, model: regime_gated_qrf}]}
  - id: aca
    ownership: modeled
    pipeline:                       # typed dedicated steps — no untyped
      - {kind: assignment, kernel: kernel:marketplace_assignment}   # escape
      - {kind: count_calibration, kernel: kernel:aca_calibration}   # hatch
    final_owner_stage: count_calibration
