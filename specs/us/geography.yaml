# DRAFT FOR REVIEW — block-first assignment (Max's 2026-08-15 ruling, #696).
#
# PHASE F3 (sol MAJOR 4): this file is the TARGET state, not the flip.
# No existing kernel performs what it declares (the block ladder lacks
# PUMA and samples inside an already-assigned CD; the PUMA ladder never
# writes block). The equivalence flip (F0–F2) encodes LEGACY geography
# exactly; this lands afterward as an intentional behavior change with a
# new versioned block artifact (exact 2020-PUMA relationship), fresh
# identity, cold caches, and statistical gates.
status: draft-for-review
phase: F3
assignment:
  anchor: census_block_2020
  order: before_gap_fill        # so PUMA/county serve as gap-fill predictors
  kernels:
    assign: kernel:block_first_assignment
    validate: kernel:block_geography_validation
  draw:
    acs: {universe: observed_puma, weight: block_population_2020}
    asec:
      county_identified: {universe: that_county, weight: block_population_2020}
      # County identification is a disclosure property of the county (whole
      # counties are on or off the CPS list), so an unidentified household is
      # KNOWN not to live in any identified county: its universe is the
      # state's complement — the SOLE rule, never the whole state (Max ruling
      # 2026-08-16; sol MINOR 1 killed the else_state fallback text).
      county_unidentified: {universe: state_minus_identified_counties,
                            weight: block_population_2020}
  identified_county_source: source:census_cps_identified_counties
  # A pinned official source id (sources.yaml), sha-bound into identity.
  # No derived-from-pooled-file fallback in production: a fallback derived
  # from a sampled file varies by rung (sol MINOR 1). If one is ever
  # unavoidable it needs an exact pre-sampling derivation + resolved list
  # digest in identity — refused until then.
  derive:
    tract_geoid: structural_prefix
    county_fips: structural_prefix
    state_fips: structural_prefix
    puma_2020: {rule: tract_relationship, assert: equals_observed_for_acs}
    congressional_district_geoid: {rule: block_equivalency, vintage: cd119}
    place_fips: {rule: block_crosswalk}
    sldu: {rule: block_crosswalk}
    sldl: {rule: block_crosswalk}
    cbsa_code: {rule: block_crosswalk}
  assertions:
    - observed_acs_state_and_puma_preserved
    - tract_to_puma_exact
  ladder_source: us_block_ladder_2020
  seed: stream:geography_block_draw     # named stream (legacy-v1 map n/a —
                                        # this whole file is post-flip)
  validation: [puma_cd_overlap_consistency, vintage_refusal]
