schema_version: 1
title: US stacked pool - imputation lineage spec
provenance: v1 extracted from code on main (b420d4ed) 2026-08-15; from here the YAML is the source of
  truth and code must conform (tests/test_imputation_lineage_spec.py)
models:
  regime_gated_qrf:
    id: regime_gated_qrf
    implementation: microcosm.fit.qrf.RegimeGatedQRF
    backend: quantile_forest.RandomForestQuantileRegressor
    n_estimators: 100
    max_samples_leaf: null
    zero_atol: 1.0e-06
    weighting: weighted bootstrap of training rows (design weights) before each forest; gate weighted
      directly via sample_weight
    regime_detection: unweighted sign support -> {three_sign, zero_inflated_positive, zero_inflated_negative,
      sign_only, positive_only, negative_only, degenerate_zero}
    gate:
      model: sklearn.ensemble.HistGradientBoostingClassifier
      draw: categorical draw against predict_proba with the seeded RNG
    magnitude:
      model: one QRF per nonzero sign class
      draw: q ~ Uniform(0,1) per row; forest queried at q
    chaining: sequential; each target conditions on predictors + previously drawn targets in the family
    boolean_targets_note: 'a 0/1 target detects as zero_inflated_positive: the whole model is the gate
      classifier + one draw; the magnitude forest is degenerate on 1'
    post_draw_calibration:
      artifact_kind: microcosm_us_post_transfer_calibration_policy
      schema_version: 1
      scope:
        reference: asec_origin_clone_0
        recipient: acs_origin_clone_0
        mutable: caller_supplied_target_cells
        provenance_masks: caller_supplied_no_internal_inference
        constraint_masks: caller_supplied_hash_bound
        value_dtype: float64_byte_contract
        zero_weight_rows: byte_exact
      quantiles:
      - 0.1
      - 0.25
      - 0.5
      - 0.75
      - 0.9
      carrier_selection:
        match_reference: weighted_positive_prevalence_nearest_prefix
        removal_order: positive_amount_descending_then_entity_id
        addition_order: entity_id
        equal_distance: lower_mass
      amount_mapping:
        leg: positive
        recipient_rank: weighted_full_recipient_positive_upper_cdf
        inverse_cdf: left
        exact_quantile_anchors:
        - 0.1
        - 0.25
        - 0.5
        - 0.75
        - 0.9
        infeasible_anchor_handling: frame_owner_fail_closed
        output_support: reference_positive_values_only
      targets:
      - entity: person
        family: adult_care
        target: pre_subsidy_care_expenses
        stage: late_transfer
        carrier_mode: match_reference
        negative_leg: byte_exact
        special_constraint: adult_care_qualifying_one_per_tax_unit
      - entity: person
        family: model_required_numeric
        target: unemployment_compensation
        stage: early_gap_fill
        carrier_mode: preserve_recipient
        negative_leg: byte_exact
        special_constraint: none
      - entity: person
        family: source_operator_child_support
        target: child_support_expense
        stage: late_transfer
        carrier_mode: match_reference
        negative_leg: byte_exact
        special_constraint: none
      - entity: person
        family: source_operator_child_support
        target: child_support_received
        stage: late_transfer
        carrier_mode: match_reference
        negative_leg: byte_exact
        special_constraint: none
      - entity: person
        family: source_operator_disability_benefits
        target: disability_benefits
        stage: late_transfer
        carrier_mode: preserve_recipient
        negative_leg: byte_exact
        special_constraint: none
      - entity: person
        family: source_operator_prior_year_income
        target: self_employment_income_last_year
        stage: early_gap_fill
        carrier_mode: match_reference
        negative_leg: byte_exact
        special_constraint: none
      - entity: person
        family: source_operator_weeks_unemployed
        target: weeks_unemployed
        stage: late_transfer
        carrier_mode: match_reference
        negative_leg: byte_exact
        special_constraint: none
      - entity: person
        family: source_operator_workers_compensation
        target: workers_compensation
        stage: late_transfer
        carrier_mode: match_reference
        negative_leg: byte_exact
        special_constraint: none
      - entity: spm_unit
        family: source_operator_energy_subsidy
        target: spm_unit_energy_subsidy
        stage: late_transfer
        carrier_mode: match_reference
        negative_leg: byte_exact
        special_constraint: none
      sha256: 8326939889ba4036c191a9ab3347a3eae98527ad79b3abc9e9f98bfc58873aa3
predictor_sets:
  acs_person_transfer:
    required:
    - age
    - is_female
    - state_fips
    optional:
    - employment_income
    - self_employment_income
    - social_security_income
    - retirement_income
    - interest_dividend_rental_income
    - is_household_head
    - tenure_code
    note: ONE shared tuple for every ACS gap-fill family, money and boolean alike; missingness handled
      by availability-pattern partition (one fit per observed-predictor pattern)
  acs_group_transfer:
    required:
    - person_count
    - age_sum
    - female_count
    - state_fips
    optional:
    - group_employment_income
    - group_self_employment_income
    - group_social_security_income
    - group_retirement_income
    - group_interest_dividend_rental_income
    - group_is_household_head
    - group_tenure_code
  puf_tax_detail:
    required:
    - puf_predictor_filing_status_code
    - puf_predictor_tax_unit_person_count
    - puf_predictor_employment_income
    - puf_predictor_self_employment_income
    - puf_predictor_taxable_interest_income
    - puf_predictor_dividend_income
    - puf_predictor_short_term_capital_gains
    - puf_predictor_long_term_capital_gains
    optional: []
    note: tax-return-shaped; no age, state, marital status, or children
