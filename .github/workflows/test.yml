name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel outdated PR runs; give each main push its own independent group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  select-countries:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      run_us: ${{ steps.plan.outputs.run_us }}
      run_uk: ${{ steps.plan.outputs.run_uk }}
    steps:
      - uses: actions/checkout@v4
      - name: Select country tests
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_test_plan.py select-countries

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Verify CI test layout
        run: python3 tools/ci_test_plan.py verify
      - name: Verify the graph acceptance burndown is monotone
        run: uv run python tools/graph_acceptance_burndown.py --verify
      - name: Sync workspace
        run: uv sync --all-packages --locked
      - name: Lint
        run: uv run --no-sync ruff check .

  engine-free:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync workspace without country engines
        run: uv sync --all-packages --locked
      - name: Run engine-free tests
        run: bash tools/run_engine_free_tests.sh

  engine-us:
    needs: select-countries
    if: needs['select-countries'].outputs.run_us == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync workspace with the US engine
        run: uv sync --all-packages --locked --extra us
      - name: Run US engine tests
        run: bash tools/run_engine_us_tests.sh
      - name: Add US engine timings to the job summary
        if: always()
        run: bash tools/add_engine_us_timing_summary.sh
      - name: Upload US engine timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-us-timings-${{ matrix.python-version }}
          path: |
            engine-us-timings.json
            engine-us-timings.md
          if-no-files-found: warn

  engine-uk:
    needs: select-countries
    if: needs['select-countries'].outputs.run_uk == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync workspace with the UK engine
        run: uv sync --all-packages --locked --extra uk
      - name: Run UK engine tests
        run: bash tools/run_engine_uk_tests.sh

  integration-uk:
    needs: select-countries
    if: needs['select-countries'].outputs.run_uk == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Run UK integration tests
        env:
          HF_STAGING_READ_TOKEN: ${{ secrets.HF_STAGING_READ_TOKEN }}
        run: bash tools/run_integration_tests.sh

  wheels:
    # Editable installs can hide missing package directories and namespace
    # mistakes. Build each wheel once and compare its contents with source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build and inspect every shard wheel
        run: tools/build_and_inspect_wheels.sh

  orrery-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/orrery-contract/package-lock.json
      - name: Sync workspace
        run: uv sync --all-packages --locked
      - name: Install the exact Orrery contract
        run: npm ci --ignore-scripts --prefix tools/orrery-contract
      - name: Parse a Microcosm export with Orrery
        run: uv run --no-sync python tools/check_orrery_contract.py

  ci-ok:
    if: always()
    needs:
      - select-countries
      - lint
      - engine-free
      - engine-us
      - engine-uk
      - integration-uk
      - wheels
      - orrery-contract
    runs-on: ubuntu-latest
    env:
      SELECT_COUNTRIES: ${{ needs.select-countries.result }}
      LINT: ${{ needs.lint.result }}
      ENGINE_FREE: ${{ needs.engine-free.result }}
      ENGINE_US: ${{ needs.engine-us.result }}
      ENGINE_UK: ${{ needs.engine-uk.result }}
      INTEGRATION_UK: ${{ needs.integration-uk.result }}
      WHEELS: ${{ needs.wheels.result }}
      ORRERY_CONTRACT: ${{ needs.orrery-contract.result }}
    steps:
      - name: Require every selected test job to pass
        run: |
          for result in \
            "$SELECT_COUNTRIES" \
            "$LINT" \
            "$ENGINE_FREE" \
            "$ENGINE_US" \
            "$ENGINE_UK" \
            "$INTEGRATION_UK" \
            "$WHEELS" \
            "$ORRERY_CONTRACT"
          do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "A required test job completed with result: $result" >&2
              exit 1
            fi
          done
