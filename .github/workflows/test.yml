name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel outdated PR runs; give each main push its own independent group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      us: ${{ steps.filter.outputs.us }}
      uk: ${{ steps.filter.outputs.uk }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify changed paths
        id: filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/classify_ci_changes.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Verify CI test layout
        run: python3 tools/ci_test_groups.py --verify
      - name: Verify the graph acceptance burndown is monotone
        run: uv run python tools/graph_acceptance_burndown.py --verify
      - name: Sync workspace
        run: uv sync --all-packages --locked
      - name: Lint
        run: uv run --no-sync ruff check .

  engine-free:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync workspace without country engines
        run: uv sync --all-packages --locked
      - name: Run engine-free tests
        env:
          RUN_US: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.us == 'true' }}
          RUN_UK: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.uk == 'true' }}
        run: |
          groups=(engine-free-shared)
          if [[ "$RUN_US" == "true" ]]; then groups+=(engine-free-us); fi
          if [[ "$RUN_UK" == "true" ]]; then groups+=(engine-free-uk); fi
          files=()
          for group in "${groups[@]}"; do
            while IFS= read -r file; do files+=("$file"); done < <(
              uv run --no-sync python tools/ci_test_groups.py --list "$group"
            )
          done
          /usr/bin/time -v uv run --no-sync pytest "${files[@]}" \
            -n 2 --dist loadfile -v --tb=short --maxfail=1 \
            --durations=25 -p no:cacheprovider

  engine-us:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.us == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync workspace with the US engine
        run: uv sync --all-packages --locked --extra us
      - name: Run US engine tests
        env:
          MEMORY_TRACE: ${{ runner.temp }}/engine-us-memory-${{ matrix.python-version }}.jsonl
        run: |
          mapfile -t files < <(
            uv run --no-sync python tools/ci_test_groups.py --list engine-us
          )
          uv run --no-sync python tools/ci_memory_monitor.py \
            --output "$MEMORY_TRACE" --interval-seconds 5 -- \
            /usr/bin/time -v uv run --no-sync pytest "${files[@]}" \
              -v --tb=short --maxfail=1 --durations=25 -p no:cacheprovider
      - name: Upload US engine memory trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-us-memory-${{ matrix.python-version }}
          path: ${{ runner.temp }}/engine-us-memory-${{ matrix.python-version }}.jsonl
          if-no-files-found: warn
          retention-days: 7

  engine-uk:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.uk == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync workspace with the UK engine
        run: uv sync --all-packages --locked --extra uk
      - name: Run UK engine tests
        run: |
          mapfile -t files < <(
            uv run --no-sync python tools/ci_test_groups.py --list engine-uk
          )
          # Keep country-engine execution serial for the same bounded-memory
          # contract as the US engine job.
          /usr/bin/time -v uv run --no-sync pytest "${files[@]}" \
            -v --tb=short --maxfail=1 --durations=25 -p no:cacheprovider

  integration-uk:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Run UK integration tests
        env:
          HF_STAGING_READ_TOKEN: ${{ secrets.HF_STAGING_READ_TOKEN }}
        run: bash tools/run_integration_tests.sh

  wheels:
    # Editable installs can hide missing package directories and namespace
    # mistakes. Build each wheel once and compare its contents with source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build and inspect every shard wheel
        run: tools/build_and_inspect_wheels.sh

  ci-ok:
    needs: [changes, lint, engine-free, engine-us, engine-uk, integration-uk, wheels]
    if: always()
    runs-on: ubuntu-latest
    env:
      EXPECT_US: ${{ github.event_name == 'push' || needs.changes.outputs.us == 'true' || needs.changes.outputs.shared == 'true' }}
      EXPECT_UK: ${{ github.event_name == 'push' || needs.changes.outputs.uk == 'true' || needs.changes.outputs.shared == 'true' }}
    steps:
      - name: Require all selected jobs to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          ENGINE_FREE_RESULT: ${{ needs['engine-free'].result }}
          ENGINE_US_RESULT: ${{ needs['engine-us'].result }}
          ENGINE_UK_RESULT: ${{ needs['engine-uk'].result }}
          INTEGRATION_UK_RESULT: ${{ needs['integration-uk'].result }}
          WHEELS_RESULT: ${{ needs.wheels.result }}
        run: |
          set -euo pipefail
          fail=0
          require_success() {
            if [[ "$2" != "success" ]]; then
              echo "::error::$1 = $2 (expected success)"
              fail=1
            fi
          }
          require_conditional() {
            expected=$2
            result=$3
            if [[ "$expected" == "true" && "$result" != "success" ]]; then
              echo "::error::$1 = $result (expected success)"
              fail=1
            elif [[ "$expected" != "true" && "$result" != "skipped" ]]; then
              echo "::error::$1 = $result (expected skipped)"
              fail=1
            fi
          }
          require_success changes "$CHANGES_RESULT"
          require_success lint "$LINT_RESULT"
          require_success engine-free "$ENGINE_FREE_RESULT"
          require_success integration-uk "$INTEGRATION_UK_RESULT"
          require_success wheels "$WHEELS_RESULT"
          require_conditional engine-us "$EXPECT_US" "$ENGINE_US_RESULT"
          require_conditional engine-uk "$EXPECT_UK" "$ENGINE_UK_RESULT"
          exit "$fail"
