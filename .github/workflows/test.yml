name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel outdated PR runs; give each main push its own independent group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

# GitHub runs an explicit `shell: bash` as `bash -eo pipefail`, and a step
# with no shell as `bash -e`, where a pipe hides the exit status of the command
# that feeds it.
defaults:
  run:
    shell: bash

# Every job sets timeout-minutes (GitHub's default is 360) so a hung test
# frees its runner from the org's shared 60-runner pool. Each cap follows the
# job's slowest successful leg on 2026-11-09, rounded up to a multiple of 5
# minutes: 1.5 times it for engine-free (109 minutes) and engine-us (73), twice
# for engine-uk (45) and integration-uk (8), and for each shorter job at least
# 5 minutes and at least twice its slowest run.

jobs:
  select-countries:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_us: ${{ steps.plan.outputs.run_us }}
      run_uk: ${{ steps.plan.outputs.run_uk }}
    steps:
      - uses: actions/checkout@v4
      - name: Select country tests
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_test_plan.py select-countries

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Verify CI test layout
        run: python3 tools/ci_test_plan.py verify
      - name: Verify the graph acceptance burndown is monotone
        run: uv run python tools/graph_acceptance_burndown.py --verify
      - name: Sync workspace
        run: uv sync --all-packages --locked
      - name: Verify the workflow against the test plan
        run: uv run --no-sync python tools/ci_test_plan.py verify-workflow
      - name: Lint
        run: uv run --no-sync ruff check .

  engine-free:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/orrery-contract/package-lock.json
      - name: Sync workspace without country engines
        run: uv sync --all-packages --locked
      - name: Run engine-free tests
        run: bash tools/run_engine_free_tests.sh

  engine-us:
    needs: select-countries
    if: needs['select-countries'].outputs.run_us == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync workspace with the US engine
        run: uv sync --all-packages --locked --extra us
      - name: Run US engine tests
        run: bash tools/run_engine_us_tests.sh
      - name: Add US engine timings to the job summary
        if: always()
        run: bash tools/add_engine_us_timing_summary.sh
      - name: Upload US engine timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-us-timings-${{ matrix.python-version }}
          path: |
            engine-us-timings.json
            engine-us-timings.md
          if-no-files-found: warn

  engine-uk:
    needs: select-countries
    if: needs['select-countries'].outputs.run_uk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync workspace with the UK engine
        run: uv sync --all-packages --locked --extra uk
      - name: Run UK engine tests
        run: bash tools/run_engine_uk_tests.sh

  integration-uk:
    needs: select-countries
    if: needs['select-countries'].outputs.run_uk == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Run UK integration tests
        env:
          HF_STAGING_READ_TOKEN: ${{ secrets.HF_STAGING_READ_TOKEN }}
        run: bash tools/run_integration_tests.sh

  wheels:
    # Editable installs can hide missing package directories and namespace
    # mistakes. Build each wheel once and compare its contents with source.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build and inspect every shard wheel
        run: tools/build_and_inspect_wheels.sh

  installed-emitter:
    # Stages bundles through the released microcosm-emitter, at the minimum
    # release builds accept and at the newest release pinned in
    # tools/installed-emitter/, with its Hugging Face Hub requests answered by
    # a loopback stand-in. It needs no secrets.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Sync workspace without country engines
        run: uv sync --all-packages --locked
      - name: Run installed-emitter tests
        run: bash tools/run_installed_emitter_tests.sh

  ci:
    # ci gives the main ruleset one check that covers the country jobs. It
    # fails unless every other job passed, or skipped because select-countries
    # succeeded and reported `false` for its country. A skipped matrix job
    # reports under its unexpanded name, so a ruleset cannot require engine-us
    # or engine-uk by name. GitHub reports a skipped required check as passing,
    # so ci runs with `if: always()`. verify-workflow refuses any other shape
    # of this job, and the plan's tests, which engine-free runs, fail on one.
    if: always()
    needs:
      - select-countries
      - lint
      - engine-free
      - engine-us
      - engine-uk
      - integration-uk
      - wheels
      - installed-emitter
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require every job to pass, or the selection to leave it out
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_test_plan.py require-results
