[project]
name = "microframe"
version = "0.1.0"
description = "The micro-stack kernel: weighted entity bundles, typed weights, strata, weighted accounting, unit structure, and the rules-engine protocol"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2",
    "pandas>=2.3",
    "pydantic>=2",
]

[project.optional-dependencies]
us = ["microunit>=0.1.0"]
policyengine = ["policyengine-us>=1.0", "microunit>=0.1.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "microunit>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microframe"]
