[project]
name = "microcosm-graph"
version = "0.1.0"
description = "The node graph: content-addressed DAG of cell-ownership nodes — declarations, node keys, store, executor, kernel protocol"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2",
    "pandas>=2.3",
    "microcosm-frame>=0.1,<0.2",
]

[tool.uv.sources]
microcosm-frame = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microcosm"]
