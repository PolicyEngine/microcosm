[project]
name = "populace-calibrate"
version = "0.1.0"
description = "The populace representation operator: compile targets into a sparse constraint system over a Frame and solve for calibrated weights (eCPS relative-error loss, torch on log-weights, hard max-weight-ratio guard, optional L0 hard-concrete pruning)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Pin the kernel to its 0.x minor series (the import-time compat gate in
    # __init__.py asserts the same floor): the constellation must resolve, not
    # fail only at import.
    "populace-frame>=0.1,<0.2",
    "numpy>=2",
    "pandas>=2.3",
    "scipy>=1.13",
    "torch>=2",
]

[tool.uv.sources]
populace-frame = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/populace"]
