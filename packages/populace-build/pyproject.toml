[project]
name = "populace-build"
version = "0.1.0"
description = "The build end of the populace stack: typed stage plans with declarative donor graphs, and the dataset acceptance gates (parity, support, aggregate-vs-admin, per-family fit, rotated holdout) every release must pass"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "PolicyEngine" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2",
    "scipy>=1.13",
    "populace-frame>=0.1,<0.2",
    "populace-fit>=0.1,<0.2",
    "populace-calibrate>=0.1,<0.2",
]

[project.optional-dependencies]
# The US extra adds the rules engine for formula-owned export checks. Source
# content is declared in packaged manifests and interpreted by shared Populace
# runtimes; country source loaders must not depend on incumbent data packages.
us = ["policyengine-us>=1.745.0,<2", "h5py>=3", "microunit>=0.1.0", "tables>=3"]
# The UK extra adds the rules engine for local metric generation from a
# Populace UK H5. Target tables remain explicit inputs, and the base package
# still does not import policyengine-uk at import time.
uk = ["policyengine-uk>=2.88", "h5py>=3", "tables>=3"]

[project.scripts]
populace-export-us-l0-refit-h5 = "populace.build.us_runtime.l0_refit_export:main"

[project.urls]
Homepage = "https://populace.dev"
Repository = "https://github.com/PolicyEngine/populace"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The package is literally named populace.build; pathspec's directory-negation
# semantics differ from git's, so the repo's `build/` ignore pattern would
# silently empty the wheel. Inclusion is explicit below — skip VCS ignores.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/populace"]

[tool.uv.sources]
populace-frame = { workspace = true }
populace-fit = { workspace = true }
populace-calibrate = { workspace = true }
