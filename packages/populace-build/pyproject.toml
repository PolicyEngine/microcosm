[project]
name = "populace-build"
version = "0.1.0"
description = "The build end of the populace stack: typed stage plans with declarative donor graphs, and the dataset acceptance gates (parity, support, aggregate-vs-admin, per-family fit, rotated holdout) every release must pass"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "PolicyEngine" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2",
    "populace-frame>=0.1,<0.2",
    "populace-fit>=0.1,<0.2",
    "populace-calibrate>=0.1,<0.2",
]

[project.optional-dependencies]
# The US build pulls survey loaders and the rules engine; the base install
# (stage machinery + gates) stays light so scorers can consume the gates
# without an engine.
us = [
    "policyengine-us>=1.729,<2",
    # 1.115.4 pins policyengine-us==1.693.5, which conflicts with the
    # current engine surface needed for formula-owned export checks. Lift the
    # cap once policyengine-us-data publishes compatible metadata again.
    "policyengine-us-data>=1.115.2,<1.115.4",
    "h5py>=3",
]

[project.urls]
Homepage = "https://populace.dev"
Repository = "https://github.com/PolicyEngine/populace"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The package is literally named populace.build; pathspec's directory-negation
# semantics differ from git's, so the repo's `build/` ignore pattern would
# silently empty the wheel. Inclusion is explicit below — skip VCS ignores.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/populace"]

[tool.uv.sources]
populace-frame = { workspace = true }
populace-fit = { workspace = true }
populace-calibrate = { workspace = true }
