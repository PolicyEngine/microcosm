  - entity: tax_unit
    column: takes_up_eitc
    fill_value: "True"
    spines: [acs_2024_1yr]
    rows: "every ACS tax unit"
    summary: >-
      Runtime-owned take-up flag, not seeded on ACS rows (reviewed limitation
      acs_take_up_engine_defaults). The EITC it gates also sets
      eligible_for_refundable_credits, which feeds the filer flag.
    consumers: [aca_ptc, chip, ctc, eitc, general_assistance, lifeline, medicaid,
      state_benefits, wic]
    notes:
      - programs: [eitc]
        verdict: known_bias
        direction: overstates
        note: "Universal take-up on ACS rows, while donor rows carry the seeded draw."
      - programs: [aca_ptc]
        verdict: known_bias
        direction: overstates
        note: >-
          Every EITC-eligible unit counts as eligible for refundable credits, so more
          ACS units file (tax_unit_is_filer) and meet the PTC's filing condition.
      - programs: [chip, medicaid]
        verdict: known_bias
        direction: mixed
        note: >-
          More ACS units count as filers, so Medicaid's non-filer household rules
          (medicaid_uses_non_filer_rules) apply to fewer of them; the direction depends
          on the household.
      - programs: [lifeline, state_benefits, wic]
        verdict: known_bias
        direction: mixed
        via: [medicaid]
        note: "Only through Medicaid enrollment."
      - programs: [ctc, general_assistance]
        verdict: harmless
        note: >-
          The CTC reads the EITC only in the additional CTC's alternative phase-in for
          three or more children (Social Security taxes minus the EITC); county general
          assistance reads only income tax withholding. Negligible.
  - entity: tax_unit
    column: would_file_taxes_voluntarily
    fill_value: "False"
    spines: [acs_2024_1yr]
    rows: "every ACS tax unit"
    summary: >-
      Voluntary-filing propensity, which donor rows carry (voluntary_filing) and ACS
      rows do not. It feeds the filer flag and the EITC's filing condition.
    consumers: [aca_ptc, chip, ctc, eitc, general_assistance, lifeline, medicaid,
      state_benefits, wic]
    notes:
      - programs: [aca_ptc, eitc]
        verdict: known_bias
        direction: understates
        note: >-
          Both require a filed return. ACS units neither required to file nor filing for
          refundable credits never file, so the few that would file anyway lose these
          credits (small for the EITC, whose eligible units mostly file for credits).
      - programs: [chip, medicaid]
        verdict: known_bias
        direction: mixed
        note: >-
          Fewer ACS units count as filers, so Medicaid's non-filer household rules apply
          to more of them; the direction depends on the household.
      - programs: [lifeline, state_benefits, wic]
        verdict: known_bias
        direction: mixed
        via: [medicaid]
        note: "Only through Medicaid enrollment."
      - programs: [ctc, general_assistance]
        verdict: harmless
        note: >-
          The CTC reads the EITC only in the additional CTC's alternative phase-in for
          three or more children; county general assistance reads only income tax
          withholding. Negligible.
  - entity: spm_unit
    column: spm_unit_energy_subsidy
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS SPM unit"
    summary: >-
      The LIHEAP amount itself: policyengine-us does not model LIHEAP and counts this
      input as a means-tested transfer (gov.household.cbo_means_tested_transfers). Its
      only readers are spm_unit_benefits and the CBO transfer total; SNAP's standard
      utility allowance reads has_heating_cooling_expense and heating_type, not this.
    consumers: [liheap]
    notes:
      - programs: [liheap]
        verdict: known_bias
        direction: understates
        note: >-
          No ACS SPM unit receives an energy subsidy, while donor rows carry the
          ASEC-based amount (energy_subsidy), so LIHEAP receipt, and the SPM resources
          that count it, are understated on ACS rows.
  - entity: spm_unit
    column: spm_unit_tenure_type
    fill_value: "'RENTER'"
    spines: [acs_2024_1yr]
    rows: "ACS group-quarters SPM units (TYPEHUGQ 2/3)"
    summary: >-
      Native ACS TEN for housing units; group quarters have none and read as renters.
    consumers: [aca_ptc, chip, general_assistance, head_start, housing_assistance,
      lifeline, medicaid, school_meals, snap, state_benefits, wic]
    notes:
      - programs: [housing_assistance]
        verdict: known_bias
        direction: overstates
        note: >-
          Group-quarters units pass HUD's renter test
          (is_eligible_for_housing_assistance). With pre_subsidy_rent 0 their gross rent
          is the HUD utility allowance, which policyengine-us encodes only for Los
          Angeles County, the Texas TDHCA area and four Kansas PHAs, so a payment arises
          only there, and only where the transferred housing take-up flag is True
          (microcosm#975).
      - programs: [aca_ptc, chip, general_assistance, head_start, lifeline, medicaid,
          school_meals, snap, state_benefits, wic]
        verdict: harmless
        note: >-
          Reached only through housing_assistance into rent, which stays 0 for these
          units because their pre-subsidy rent is 0, and into California CARE and FERA
          income (Los Angeles County group quarters only); negligible.
