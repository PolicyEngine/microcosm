        verdict: harmless
        note: >-
          Reached only through the behavioral responses (labor_supply_behavioral_response
          and capital_gains_behavioral_response), which return 0 before reading anything
          in an engine pass without a reform, as every release pass is, together with
          the 2020-only charitable deduction for non-itemizers
          (charitable_contributions_ald), which is 0 before it reads anything in any
          other year, or, for SSI, the contributed COLA means test
          (social_security_cola_means_test_withheld), which is False unless
          gov.contrib.ssa.benefit_levers.cola.means_test.enabled; inert.
