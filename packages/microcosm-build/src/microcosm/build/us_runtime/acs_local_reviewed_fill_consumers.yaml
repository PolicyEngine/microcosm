          the CTC phases out only above $200,000 of AGI. All negligible.
  - entity: person
    column: is_separated
    fill_value: "False"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      ACS MAR 4 (separated) is not mapped, so every ACS person reads as not separated.
      policyengine-us uses the flag for the separate filing status (a separated head
      without a qualifying child files separately), the IRC 7703(b) head-of-household
      path, and to stop any member of a separated person's tax unit from being ranked
      the tax-unit spouse. A native fill from MAR is a follow-up.
    consumers: [aca_ptc, chip, ctc, eitc, general_assistance, head_start,
      housing_assistance, lifeline, medicaid, school_meals, snap, ssi, state_benefits,
      tanf, wic]
    notes:
      - programs: [aca_ptc]
        verdict: known_bias
        direction: overstates
        note: >-
          Separated ACS filers without a qualifying child file single instead of
          separately, so the PTC's separate-filer bar (is_aca_ptc_eligible) never
          applies to them.
      - programs: [chip, ctc, eitc, general_assistance, housing_assistance, medicaid,
          snap, ssi, tanf]
        verdict: known_bias
        direction: mixed
        note: >-
          Filing status and the tax-unit spouse role change: a separated head's unit
          files single or head of household instead of separately, and another adult in
          the unit can be ranked the tax-unit spouse (is_tax_unit_spouse), which moves
          joint thresholds, SSI spousal deeming, SNAP and TANF dependency rules, HUD
          dependents and Los Angeles and Marin general relief marital rules. ACS MAR 4
          persons have no spouse in the household, so this matters only in units that
          hold another adult.
      - programs: [head_start, lifeline, school_meals, state_benefits, wic]
        verdict: known_bias
        direction: mixed
        via: [medicaid, snap, tanf]
        note: "Only through Medicaid, SNAP and TANF results."
  - entity: person
    column: is_surviving_spouse
    fill_value: "False"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      Not mapped from ACS MAR 2 (widowed), so no ACS head qualifies for the
      surviving-spouse filing status (surviving_spouse_eligible also needs a child
      dependent); such heads file as head of household. The status needs a death in the
