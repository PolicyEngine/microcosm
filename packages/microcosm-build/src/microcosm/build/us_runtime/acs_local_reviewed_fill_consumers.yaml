  - entity: person
    column: weeks_worked
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "ACS persons under 16, outside the WKWN universe"
    summary: >-
      Weeks worked in the past 12 months. Staging maps ACS WKWN natively on every ACS
      row (microcosm#1021) and leaves it blank, with WKHP, below age 16, where the ACS
      does not ask it. policyengine-us 2.145.3 reads it as an input (its 2.2.1
      formula_2025 is gone, policyengine-us#9660): SNAP's work tests average usual hours
      over the year with it, Wisconsin Works averages the W-2 parent's hours, Hawaii TDI
      counts qualifying weeks and SPM work expenses count adults' weeks. 0 is the
      engine's "not reported" value, which keeps usual hours unchanged.
    consumers: [aca_ptc, chip, ctc, eitc, general_assistance, head_start,
      housing_assistance, lifeline, medicaid, school_meals, snap, ssi, state_benefits,
      tanf, wic]
