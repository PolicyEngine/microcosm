  - entity: person
    column: pre_subsidy_rent
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "ACS group-quarters persons (TYPEHUGQ 2/3)"
    summary: >-
      Transferred for ACS housing-unit persons; group-quarters persons are outside the
      ACS rent universe and keep the default. ACS group quarters include
      noninstitutional ones (emergency and transitional shelters, group homes,
      workers' quarters), whose residents can pay for their shelter; 0 is right only
      for those who pay nothing.
    consumers: [aca_ptc, chip, ctc, eitc, general_assistance, head_start,
      housing_assistance, lifeline, medicaid, school_meals, snap, ssi, state_benefits,
      tanf, wic]
    notes:
      - programs: [snap]
        verdict: known_bias
        direction: understates
        note: >-
          Conditional on paid shelter: a resident of noninstitutional group quarters who
          pays for their shelter loses SNAP's excess shelter deduction at 0 (7 CFR
          273.9(d)(6)), so SNAP is understated for them. Most institutional
          group-quarters residents are ineligible for SNAP anyway (7 CFR 273.1(e)), and
          residents who pay nothing are right at 0. In Arizona, Florida, New York and
          Vermont the smaller TANF shelter allowance below also reaches SNAP (TANF cash
          is SNAP income, and TANF receipt confers categorical eligibility), which only
          partly offsets.
      - programs: [tanf]
        verdict: known_bias
        direction: understates
        note: >-
          Conditional on paid shelter: the Arizona, Florida, New York and Vermont TANF
          shelter allowances read the rent, so a group-quarters resident who pays for
          shelter in those states gets too small an allowance.
      - programs: [general_assistance, state_benefits]
        verdict: known_bias
        direction: understates
        note: >-
          Conditional on paid shelter: Los Angeles and Riverside general relief,
          Nebraska AABD's standard of need and Connecticut SSP's shelter allowance read
          housing costs or rent, so they are too low for a group-quarters resident who
          pays for shelter.
      - programs: [head_start, lifeline, wic]
        verdict: known_bias
        direction: understates
        via: [snap, tanf]
        note: >-
          Only through SNAP and TANF categorical or adjunctive eligibility. Head Start's
          own housing-cost adjustment (head_start_countable_income) applies only when
          head_start_applies_housing_cost_adjustment is set, which it is not on these
          rows.
      - programs: [school_meals]
        verdict: known_bias
        direction: mixed
        via: [snap, state_benefits, tanf]
        note: >-
          Through SNAP and TANF categorical eligibility, understated as above; and
          through the Connecticut SSP, Nebraska AABD and Illinois AABD payments that
          school meals count as income (Illinois AABD directly, since it is outside
          state benefits), whose shelter allowances read rent (ct_ssp_shelter_allowance,
          il_aabd_shelter_allowance, ne_aabd_standard_of_need), so at 0 a recipient's
          school-meal income is too low. Both only for a group-quarters unit that holds a K-12 student.
      - programs: [medicaid]
        verdict: known_bias
        direction: understates
        via: [snap]
        note: >-
          No effect for 2024. Medicaid reads SNAP only through the community-engagement
          pass-through, and policyengine-us applies Medicaid work requirements from 2027
          (gov.hhs.medicaid.eligibility.work_requirements.applies). From then, a
          resident whose understated SNAP falls to zero loses that pass-through and must
          meet the work requirement.
      - programs: [aca_ptc]
        verdict: known_bias
        direction: mixed
        via: [medicaid]
        note: >-
          No effect for 2024, and none in practice from 2027: an adult the Medicaid path
          above leaves without Medicaid fails only the work requirement, which bars the
          Marketplace too (is_medicaid_ineligible_due_to_work_requirement in
          gov.aca.ineligible_coverage). Kept known_bias because REVIEWED_FILL_COUPLINGS
          requires it wherever Medicaid is.
      - programs: [chip, ctc, housing_assistance]
        verdict: harmless
        note: >-
          HUD assistance attaches to housing units, not group quarters, so any payment
          to these units comes from the renter test (noted on spm_unit_tenure_type):
          with pre_subsidy_rent 0, hud_gross_rent is the HUD utility allowance alone,
          encoded only for Los Angeles County, the Texas TDHCA area and four Kansas
          PHAs, and a true rent would only enlarge that payment. CHIP reads Medicaid
          eligibility only for children and pregnant people, whom the Medicaid work
          requirement exempts. The CTC sees only the tax chain (TANF in the state
          sales-tax deduction); negligible.
      - programs: [eitc]
        verdict: harmless
        note: >-
          Reached only through the 2020-only charitable deduction for non-itemizers
          (charitable_contributions_ald), which is 0 before it reads anything in any
          other year, and the behavioral responses (labor_supply_behavioral_response and
          capital_gains_behavioral_response, which read household_net_income, and the
          labor-supply elasticities they gate), which return 0 before reading anything
          in an engine pass without a reform; inert.
      - programs: [ssi]
        verdict: harmless
