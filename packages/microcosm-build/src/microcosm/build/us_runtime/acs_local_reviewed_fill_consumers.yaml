      - programs: [aca_ptc, chip, ctc, general_assistance, head_start,
          housing_assistance, lifeline, medicaid, school_meals, snap, state_benefits,
          tanf, wic]
        verdict: harmless
        note: >-
          The filled rows are persons under 16. Below 15 their usual hours are the
          modeled 0, so the averaged hours are 0 whatever the weeks. At 15 none of the
          rules that read the average applies: SNAP's general work requirements exempt
          persons under 16 and the ABAWD time limit starts at 18, Medicaid's work
          requirement (from 2027) covers ages 19 to 64, and Wisconsin Works reads the
          hours of the W-2 parent (a custodial parent or the tax-unit head or spouse who
          claims the child), rarely a person under 16. Hawaii TDI reaches only the Marin
          and Los Angeles general relief net incomes, through payroll withholding, a
          route no household can take. The other consumers read these only through
          those programs' results.
