  - entity: person
    column: s_corp_income
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      S corporation income. The ACS asks no separate item: SEMP covers unincorporated
      businesses and owners report salaries from their own corporation in WAGP, so
      pass-through profit is missing on ACS rows. SNAP's income sources do not include
      it.
    consumers: [aca_ptc, chip, ctc, eitc, general_assistance, head_start,
      housing_assistance, lifeline, medicaid, school_meals, snap, ssi, state_benefits,
      tanf, wic]
    notes:
      - programs: [ctc, eitc, housing_assistance, lifeline, medicaid, state_benefits,
          tanf]
        verdict: known_bias
        direction: overstates
        note: >-
          It counts in MAGI, AGI (the EITC and CTC phase-outs), HUD unearned income, IRS
          gross income (Lifeline), South Carolina TANF unearned income and several state
          benefits' income (New Jersey, child care in Massachusetts, Oklahoma and
          Wisconsin), so owners' incomes are understated and eligibility overstated. S
          corporation owners are rarely in these programs' income ranges.
      - programs: [aca_ptc, chip]
        verdict: known_bias
        direction: mixed
        via: [medicaid]
        note: >-
          Understated MAGI raises the PTC and CHIP eligibility directly, but it also
          brings some owners' households under the Medicaid limit, and Medicaid
          eligibility bars both the PTC (is_aca_marketplace_enrollee) and CHIP
          (is_chip_eligible_child), so those households lose PTC or CHIP eligibility
          instead.
      - programs: [snap]
        verdict: known_bias
        direction: mixed
        via: [tanf]
        note: >-
          SNAP does not count S corporation income; only through South Carolina TANF
          (sc_tanf): more TANF cash is SNAP unearned income, and TANF receipt confers
          SNAP categorical eligibility.
      - programs: [head_start]
        verdict: known_bias
        direction: overstates
        via: [tanf]
        note: >-
          It does not count S corporation income; only through South Carolina TANF
          receipt, which confers categorical eligibility.
      - programs: [school_meals]
        verdict: known_bias
        direction: overstates
        note: >-
          School meals count each person's S corporation income, a net loss as zero
          (partnership_s_corp_income in gov.usda.school_meals.income.business_sources),
          so owners' school-meal income is understated and eligibility overstated; S
          corporation owners are rarely in these income ranges.
      - programs: [wic]
        verdict: known_bias
        direction: overstates
        via: [medicaid, tanf]
        note: >-
          WIC does not count it; only adjunctive eligibility through Medicaid and South
          Carolina TANF.
      - programs: [general_assistance]
        verdict: harmless
        note: >-
          It does not count S corporation income. Its static paths run through Medicare
          IRMAA, TANF and child-care subsidy results and income tax withholding;
          negligible.
      - programs: [ssi]
        verdict: harmless
        note: >-
