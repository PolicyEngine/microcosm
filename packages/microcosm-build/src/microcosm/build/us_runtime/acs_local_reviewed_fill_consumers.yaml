      - programs: [ctc, general_assistance, head_start, housing_assistance,
          school_meals, snap, tanf]
        verdict: harmless
        note: >-
          They count self-employment income before this deduction and read AGI only
          through Medicare IRMAA (AGI two years prior, above $103,000 for a single filer
