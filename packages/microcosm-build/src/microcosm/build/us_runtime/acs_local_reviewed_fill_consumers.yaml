  - entity: person
    column: health_insurance_premiums
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      A direct premium override. The statutory medical-expense aggregate
      (medical_expense_health_insurance_premiums) reads 0 as not supplied and uses the
      transferred health_insurance_premiums_without_medicare_part_b plus the modeled
      Part B premium instead. The self-employed health insurance deduction, Missouri's
      child care subsidy, Orange County general relief and a few state income taxes read
      it directly.
    consumers: [aca_ptc, chip, ctc, eitc, general_assistance, head_start,
      housing_assistance, lifeline, medicaid, school_meals, snap, state_benefits, tanf,
      wic]
    notes:
      - programs: [aca_ptc, chip, eitc, medicaid]
        verdict: known_bias
        direction: understates
        note: >-
          Jointly with is_self_employed, also at its default on ACS rows: no ACS person
          gets the self-employed health insurance deduction, so AGI and MAGI are
          slightly too high for self-employed people who buy their own coverage (the
          EITC phase-out reads AGI).
      - programs: [lifeline, wic]
        verdict: known_bias
        direction: understates
        via: [medicaid]
        note: >-
          Only through Medicaid enrollment (adjunctive eligibility); Lifeline's income
          test reads IRS gross income, before the deduction.
      - programs: [general_assistance, state_benefits]
        verdict: known_bias
        direction: understates
        note: >-
          Missouri's child care subsidy deducts only these premiums from gross income
          (mo_ccs_adjusted_income) and Orange County general relief deducts them from
          countable income, so at 0 both see slightly too much income; California's CVRP
          reads AGI (above).
      - programs: [ctc, head_start, housing_assistance, school_meals, snap, tanf]
        verdict: harmless
        note: >-
          SNAP's excess medical deduction and HUD's medical expenses read the
          medical-expense aggregate, where 0 means not supplied, and so read the
          transferred premiums. The remaining paths are second-order and negligible:
          Missouri's smaller child care subsidy leaves slightly larger out-of-pocket
          child care for the SNAP, HUD and Missouri TANF child-care deductions and the
          CDCC ahead of the CTC; the CTC phases out only above $200,000 of AGI; Head
          Start and school meals follow SNAP and TANF receipt.
