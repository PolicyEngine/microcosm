# Reviewed default fills of the ACS local lane and their means-tested consumers
# (microcosm#1022, part 6).
#
# fill_reviewed_nulls in tools/build_us_acs_local_release.py writes the
# policyengine-us default into every missing cell of a registered engine input.
# "Registered" only means the fill is allowed. This file says, for each fill the
# lane still applies, which means-tested programs read it and whether the
# default is harmless for each of them or biases it in a known direction.
#
# Method
# - programs: the means-tested program roots. They are the engine's own list
#   gov.household.cbo_means_tested_transfers (Medicaid, CHIP, SNAP, housing
#   assistance, SSI, TANF, free and reduced-price school meals, the SPM energy
#   subsidy and general assistance), plus the income-tested programs
#   microcosm#1022 names that the CBO list leaves out (ACA premium tax credit,
#   WIC, Lifeline, Head Start, EITC, CTC), plus the engine's state benefit
#   aggregate household_state_benefits for state means-tested programs, and the
#   county general assistance and relief programs policyengine-us models as
#   standalone outputs. State income tax credits are out of scope.
# - consumers: every program with a root the column reaches in the static
#   dependency graph of the pinned engine
#   (PolicyEngineUSVariableMetadataIndex.consumer_receipts with follow_helpers,
#   so a read inside one of the engine's helper functions is its calling
#   variable's, walked from the column to its consumers until nothing new is
#   reached). A column that is a root reaches its own program. The engine-tier
#   test test_us_acs_local_reviewed_fill_consumers.py recomputes the walk and
#   fails when a list here differs from it.
# - notes: each consumer is covered by exactly one note. verdict is harmless
#   when the default does not change the program's result on the filled rows,
#   or changes it only negligibly, and the note says why (the default is the
#   true value there, the path is inert on those rows, or it is second-order).
#   verdict is known_bias when the default moves the program's result for an
#   identifiable group; direction is overstates (more eligibility or benefit
#   than the true value would give), understates or mixed. via names the
#   programs whose results carry an inherited effect.
# - couplings: a program that reads another program's result inherits its bias.
#   Medicaid and CHIP eligibility bar the PTC (is_aca_marketplace_enrollee) and Medicaid
#   eligibility bars CHIP (is_chip_eligible_child), so a Medicaid bias moves them
#   the opposite way; SSI and TANF are SNAP unearned income, and TANF receipt
#   confers SNAP categorical eligibility; Medicaid, SNAP and TANF receipt confer
#   Lifeline, WIC, school-meal and Head Start eligibility. Register validation
#   (REVIEWED_FILL_COUPLINGS, and so the release gate) fails when an entry marks
#   Medicaid, CHIP, SSI or TANF known_bias and leaves the PTC or SNAP harmless,
#   or gives the PTC Medicaid's own direction; the engine-tier test checks that
#   each coupling is an edge of the engine's dependency graph and that every
#   column reaching it declares both programs (microcosm#1071 review).
#
# The release tool's acs_local_reviewed_fill_consumers gate fails finalize and
# package when a fill the release applies has no entry here, when an entry's
# fill value or spines differ from the fill manifests, when a declared consumer
# has no note, or when the policyengine-us the release runs is not
# reviewed_against. An entry for a column the release did not fill is reported,
# not failed. Adding an entry for a new reviewed fill is a data-only change to
# this file.
schema_version: 1
issue: "microcosm#1022"
reviewed_against:
  policyengine_us: "2.145.3"
programs:
  aca_ptc:
    label: "ACA premium tax credit"
    roots: [aca_ptc, assigned_aca_ptc]
  chip:
    label: "CHIP"
    roots: [chip]
  ctc:
    label: "Federal CTC"
    roots: [refundable_ctc, non_refundable_ctc]
  eitc:
    label: "Federal EITC"
    roots: [eitc]
  general_assistance:
    label: >-
      General assistance: the CBO input and the county general assistance and relief
      programs policyengine-us models
    roots: [general_assistance, ca_ala_general_assistance, ca_cc_general_assistance,
      ca_marin_general_relief, ca_oc_general_relief, ca_riv_general_relief,
      ca_sbd_general_relief, ca_scc_general_assistance, ca_sf_caap,
      ca_smc_general_assistance, la_general_relief]
  head_start:
    label: "Head Start and Early Head Start"
    roots: [head_start, early_head_start]
  housing_assistance:
    label: "HUD housing assistance"
    roots: [housing_assistance]
  lifeline:
    label: "Lifeline"
    roots: [lifeline]
  liheap:
    label: "LIHEAP (the SPM energy subsidy input)"
    roots: [spm_unit_energy_subsidy]
  medicaid:
    label: "Medicaid"
    roots: [medicaid]
  school_meals:
    label: "Free and reduced-price school meals"
    roots: [free_school_meals, reduced_price_school_meals]
  snap:
    label: "SNAP"
    roots: [snap]
  ssi:
    label: "SSI"
    roots: [ssi]
  state_benefits:
    label: "State means-tested benefits (household_state_benefits)"
    roots: [household_state_benefits]
  tanf:
    label: "TANF, the federal total of every state program"
    roots: [tanf]
  wic:
    label: "WIC"
    roots: [wic]
entries:
  - entity: person
    column: attends_eligible_educational_institution_for_american_opportunity_credit
    fill_value: "False"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      One of five American opportunity credit (AOTC) conditions, all False on ACS rows
      because the ACS asks none of them, so no ACS student claims the AOTC and qualified
      tuition goes to the lifetime learning credit instead.
    consumers: [aca_ptc, chip, ctc, eitc, general_assistance, head_start,
      housing_assistance, lifeline, medicaid, school_meals, snap, ssi, state_benefits,
      tanf, wic]
    notes:
      - programs: [ctc]
        verdict: known_bias
        direction: mixed
        note: >-
          The CTC reads education credits only as nonrefundable credits ahead of it in
          its tax-liability limit (ctc_limiting_tax_liability). With the lifetime
          learning credit in place of the AOTC's nonrefundable part, that limit moves a
          little either way, and only where tax liability binds the CTC.
      - programs: [aca_ptc, chip, general_assistance, lifeline, medicaid,
          state_benefits, wic]
        verdict: harmless
        note: >-
          Reached only through the tax-liability chain: nonrefundable credits ahead of
          the CTC, then refundable_ctc, eligible_for_refundable_credits and
          tax_unit_is_filer, which Medicaid's non-filer rules and the PTC's filing
          condition read, and programs that read Medicaid enrollment. A change in tax
          liability moves the refundable CTC to or from zero only for a unit with
          positive income tax, which is already required to file, so the filer flag and
          everything past it do not change. County general assistance subtracts income
          tax or payroll withholding from earnings (Santa Clara, Marin, Los Angeles),
          but its applicants owe almost none.
      - programs: [head_start, school_meals, snap]
        verdict: harmless
        note: >-
          Reached only through the filer flag, which a change in tax liability cannot
          flip: only a unit already required to file has tax liability for these
          deductions and credits to change (see the Medicaid note).
      - programs: [eitc, housing_assistance, tanf]
        verdict: harmless
        note: >-
          Reached only through the 2020-only charitable deduction for non-itemizers
          (charitable_contributions_ald), which is 0 before it reads anything in any
          other year, and the behavioral responses (labor_supply_behavioral_response and
          capital_gains_behavioral_response, which read household_net_income, and the
          labor-supply elasticities they gate), which return 0 before reading anything
          in an engine pass without a reform; inert.
      - programs: [ssi]
        verdict: harmless
        note: >-
          Reached only through the 2020-only charitable deduction for non-itemizers
          (charitable_contributions_ald), which is 0 before it reads anything in any
          other year, and/or the contributed COLA means test
          (social_security_cola_means_test_withheld), which is False unless
          gov.contrib.ssa.benefit_levers.cola.means_test.enabled, and the behavioral
          responses (labor_supply_behavioral_response and
          capital_gains_behavioral_response, which read household_net_income, and the
          labor-supply elasticities they gate), which return 0 before reading anything
          in an engine pass without a reform; inert.
  - entity: person
    column: cps_race
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      CPS race code. Read only by race, a demographic label no means-tested program
      reads (ACS RAC1P could fill it natively).
    consumers: []
    notes: []
  - entity: person
    column: detailed_occupation_recode
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: "No policyengine-us 2.145.3 variable reads it."
    consumers: []
    notes: []
  - entity: person
    column: educational_assistance
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      Scholarships, grants and other educational assistance received; no ACS item
      isolates it. SNAP does not count it.
    consumers: [aca_ptc, chip, ctc, eitc, general_assistance, head_start,
      housing_assistance, lifeline, medicaid, school_meals, snap, ssi, state_benefits,
      tanf, wic]
    notes:
      - programs: [wic]
        verdict: known_bias
        direction: overstates
        note: >-
          WIC counts educational assistance as income (gov.usda.wic.income.sources). At
          0, families with a student receiving aid look slightly poorer, so eligibility
          is slightly overstated.
      - programs: [school_meals]
        verdict: harmless
        note: >-
          School meals no longer count educational assistance
          (gov.usda.school_meals.income.sources leaves it out, citing 20 U.S.C. 1087uu).
          The only remaining static path runs from WIC receipt through California CARE's
          electricity discount into Illinois AABD's utility allowance, which no
          household can take: CARE is defined for California and the AABD utility
          allowance for Illinois.
      - programs: [general_assistance]
        verdict: known_bias
        direction: overstates
        note: >-
          Orange County and San Bernardino County general relief count it as unearned
          income, so a student with aid looks slightly poorer.
      - programs: [state_benefits]
        verdict: harmless
        note: >-
          Its only state-benefit routes are California's CVRP, whose income test counts
          it (ca_cvrp_countable_income), and California CARE, through WIC receipt. Both
          pay nothing on these files: CVRP's rebate needs a purchased-vehicle amount
          (ca_cvrp_vehicle_rebate_amount) and CARE's discounts an electricity or gas
          expense, which no stage writes.
      - programs: [aca_ptc, chip, ctc, eitc, head_start, housing_assistance, lifeline,
          medicaid, snap, ssi, tanf]
        verdict: harmless
        note: >-
          Reached only through the behavioral responses
          (labor_supply_behavioral_response and capital_gains_behavioral_response, which
          read household_net_income, and the labor-supply elasticities they gate), which
          return 0 before reading anything in an engine pass without a reform, as every
          release pass is; inert.
  - entity: person
    column: employment_income_before_lsr
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "ACS persons under 15, outside the WAGP universe"
    summary: >-
      Wages before labor-supply responses. ACS WAGP is asked from age 15, so only
      persons under 15 are filled.
    consumers: [aca_ptc, chip, ctc, eitc, general_assistance, head_start,
      housing_assistance, lifeline, medicaid, school_meals, snap, ssi, state_benefits,
      tanf, wic]
    notes:
      - programs: [aca_ptc, chip, ctc, eitc, general_assistance, head_start,
          housing_assistance, lifeline, medicaid, school_meals, snap, ssi,
          state_benefits, tanf, wic]
        verdict: harmless
        note: >-
          0 is the source-consistent value: WAGP is not asked below age 15, and the
          certified ASEC frame also carries an explicit zero there
          (acs_income_universe).
  - entity: person
    column: federal_parent_plus_loan_balance
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      Federal Parent PLUS loan balance, which the national build imputes from the SCF
      (scf_education_debt, microcosm#1073); the ACS asks no debt item. Read only by
      the Parent PLUS and combined standard repayment payments
      (parent_plus_standard_repayment_payment, parent_plus_standard_amortized_payment,
      combined_standard_repayment_payment, tiered_standard_repayment_payment), which
      reach no means-tested program. At 0, ACS parents carry no Parent PLUS debt.
    consumers: []
    notes: []
  - entity: person
    column: federal_student_loan_balance
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      Federal student loan balance, which the national build imputes from the SCF
      (scf_education_debt, microcosm#1073); the ACS asks no debt item. Read only by the
      federal repayment plans (standard, tiered, income-based, income-contingent, PAYE,
      SAVE and RAP payments, and income-driven eligibility), which reach no means-tested
      program. At 0, ACS borrowers carry no federal student debt and every repayment
      payment is 0.
    consumers: []
    notes: []
  - entity: person
    column: federal_student_loan_graduate_share
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      Graduate share of the federal student loan balance (scf_education_debt,
      microcosm#1073). Read only by save_plan_payment, which reaches no means-tested
      program; inert while federal_student_loan_balance is the reviewed default 0 on
      the same rows.
    consumers: []
    notes: []
  - entity: person
    column: fsla_overtime_premium
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      FLSA overtime premium, which the ACS does not separate from WAGP. Read by the
      federal overtime deduction (tax years 2025-2028, P.L. 119-21) and Georgia's
      overtime exclusion.
    consumers: [aca_ptc, chip, ctc, eitc, general_assistance, head_start,
      housing_assistance, lifeline, medicaid, school_meals, snap, ssi, state_benefits,
      tanf, wic]
    notes:
      - programs: [ctc]
        verdict: known_bias
        direction: overstates
        note: >-
          No effect for 2024. From tax year 2025 the missing overtime deduction leaves
          ACS taxable income and tax too high, which leaves more room for the
          nonrefundable CTC, so the CTC is weakly overstated where tax liability limits
          it.
      - programs: [aca_ptc, chip, general_assistance, lifeline, medicaid,
          state_benefits, wic]
        verdict: harmless
        note: >-
          A below-the-line deduction leaves AGI and MAGI unchanged. Reached only through
          the tax-liability chain: nonrefundable credits ahead of the CTC, then
          refundable_ctc, eligible_for_refundable_credits and tax_unit_is_filer, which
          Medicaid's non-filer rules and the PTC's filing condition read, and programs
