  - entity: household
    column: household_vehicles_value
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS household"
    summary: >-
      The ACS asks how many vehicles a household keeps (VEH) but not their value
      (reviewed limitation acs_household_vehicle_value_default). SNAP's own asset test
      (snap_assets) reads no vehicle.
    consumers: [aca_ptc, chip, ctc, eitc, general_assistance, head_start,
      housing_assistance, lifeline, medicaid, school_meals, snap, ssi, state_benefits,
      tanf, wic]
    notes:
      - programs: [snap]
        verdict: known_bias
        direction: mixed
        note: >-
          Overstates eligibility in Texas, whose broad-based categorical eligibility
          asset test (meets_tanf_non_cash_asset_test) counts vehicle value above $22,500
          for the first vehicle and $8,700 for each other against a $5,000 limit.
          Elsewhere it acts only through TANF: more TANF cash (SNAP unearned income) and
          CalWORKs child care (a smaller dependent-care deduction) slightly lower SNAP.
      - programs: [general_assistance, medicaid, state_benefits, tanf]
        verdict: known_bias
        direction: overstates
        note: >-
          Zero vehicle equity passes the vehicle resource tests of TANF in Texas,
          Washington, Montana, Tennessee, California and Wisconsin, California CAPI,
          Washington RCA (through the TANF resource test), the California county general
          assistance and relief programs (Contra Costa, Marin, Orange, Riverside, San
          Bernardino, Santa Clara, San Francisco CAAP, San Mateo, Los Angeles), and the
          asset test of Illinois's Medicaid buy-in for workers with disabilities (HBWD:
          il_aabd_countable_vehicle_value in il_hbwd_countable_assets, against a
          $25,000 limit), so Medicaid eligibility is overstated there.
      - programs: [aca_ptc]
        verdict: known_bias
        direction: understates
        via: [medicaid]
        note: >-
          Medicaid eligibility bars the PTC: an Illinois worker with a disability whose
          zero vehicle value passes the HBWD asset test is modeled Medicaid-eligible
          (is_medicaid_eligible), fails is_aca_marketplace_enrollee and loses the whole credit
          (is_aca_ptc_eligible), even where the true vehicle value would leave an
          otherwise eligible 2024 Marketplace adult. Illinois only, but the full credit
          for each person it reaches.
      - programs: [chip]
        verdict: known_bias
        direction: understates
        via: [medicaid]
        note: >-
          CHIP requires Medicaid ineligibility (is_chip_eligible_child). HBWD covers ages
          16 to 64, so a 16- to 18-year-old it makes Medicaid-eligible in Illinois loses
          CHIP; tiny.
      - programs: [lifeline, wic]
        verdict: known_bias
        direction: overstates
        via: [medicaid, snap, tanf]
        note: >-
          Only through Medicaid, SNAP and TANF receipt, which confer Lifeline
          eligibility (is_lifeline_eligible) and WIC adjunctive eligibility: the
          Illinois HBWD buy-in, Texas's SNAP asset test and the state TANF resource
          tests above.
      - programs: [head_start]
        verdict: known_bias
        direction: overstates
        via: [snap, tanf]
        note: "Only through TANF and SNAP categorical eligibility."
      - programs: [school_meals]
        verdict: known_bias
        direction: mixed
        via: [snap, tanf]
        note: >-
          Mostly overstated through TANF and SNAP categorical eligibility. School meals
          also count Illinois AABD as income, and zero vehicle value passes AABD's asset
          test (il_aabd_countable_vehicle_value), so the family of an Illinois AABD
          recipient with vehicle equity sees too much school-meal income.
      - programs: [ctc, housing_assistance]
        verdict: harmless
        note: >-
          Second-order and negligible: TANF income in HUD income, and CalWORKs child
          care in the CDCC ahead of the CTC and in HUD's child-care deduction.
      - programs: [eitc]
        verdict: harmless
        note: >-
          Reached only through the 2020-only charitable deduction for non-itemizers
          (charitable_contributions_ald), which is 0 before it reads anything in any
          other year, and the behavioral responses (labor_supply_behavioral_response and
          capital_gains_behavioral_response, which read household_net_income, and the
