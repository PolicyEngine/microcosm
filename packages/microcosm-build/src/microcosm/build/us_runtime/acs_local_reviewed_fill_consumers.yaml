# Reviewed default fills of the ACS local lane and their means-tested consumers
# (microcosm#1022, part 6).
#
# fill_reviewed_nulls in tools/build_us_acs_local_release.py writes the
# policyengine-us default into every missing cell of a registered engine input.
# "Registered" only means the fill is allowed. This file says, for each fill the
# lane still applies, which means-tested programs read it and whether the
# default is harmless for each of them or biases it in a known direction.
#
# Method
# - programs: the means-tested program roots. They are the engine's own list
#   gov.household.cbo_means_tested_transfers (Medicaid, CHIP, SNAP, housing
#   assistance, SSI, TANF, free and reduced-price school meals, the SPM energy
#   subsidy and general assistance), plus the income-tested programs
#   microcosm#1022 names that the CBO list leaves out (ACA premium tax credit,
#   WIC, Lifeline, Head Start, EITC, CTC), plus the engine's state benefit
#   aggregate household_state_benefits for state means-tested programs, and the
#   county general assistance and relief programs policyengine-us models as
#   standalone outputs. State income tax credits are out of scope.
# - consumers: every program with a root the column reaches in the static
#   dependency graph of the pinned engine
#   (PolicyEngineUSVariableMetadataIndex.consumer_receipts, walked from the
#   column to its consumers until nothing new is reached). A column that is a
#   root reaches its own program. The engine-tier test
#   test_us_acs_local_reviewed_fill_consumers.py recomputes the walk and fails
#   when a list here differs from it.
# - notes: each consumer is covered by exactly one note. verdict is harmless
#   when the default does not change the program's result on the filled rows,
#   or changes it only negligibly, and the note says why (the default is the
#   true value there, the path is inert on those rows, or it is second-order).
#   verdict is known_bias when the default moves the program's result for an
#   identifiable group; direction is overstates (more eligibility or benefit
#   than the true value would give), understates or mixed. via names the
#   programs whose results carry an inherited effect.
#
# The release tool's acs_local_reviewed_fill_consumers gate fails finalize and
# package when a fill the release applies has no entry here, when an entry's
# fill value or spines differ from the fill manifests, or when a declared
# consumer has no note. An entry for a column the release did not fill is
# reported, not failed. Adding an entry for a new reviewed fill is a data-only
# change to this file.
schema_version: 1
issue: "microcosm#1022"
reviewed_against:
  policyengine_us: "2.2.1"
programs:
  aca_ptc:
    label: "ACA premium tax credit"
    roots: [aca_ptc, assigned_aca_ptc]
  chip:
    label: "CHIP"
    roots: [chip]
  ctc:
    label: "Federal CTC"
    roots: [refundable_ctc, non_refundable_ctc]
  eitc:
    label: "Federal EITC"
    roots: [eitc]
  general_assistance:
    label: >-
      General assistance: the CBO input and the county general assistance and relief
      programs policyengine-us models
    roots: [general_assistance, ca_ala_general_assistance, ca_cc_general_assistance,
      ca_marin_general_relief, ca_oc_general_relief, ca_riv_general_relief,
      ca_sbd_general_relief, ca_scc_general_assistance, ca_sf_caap,
      ca_smc_general_assistance, la_general_relief]
  head_start:
    label: "Head Start and Early Head Start"
    roots: [head_start, early_head_start]
  housing_assistance:
    label: "HUD housing assistance"
    roots: [housing_assistance]
  lifeline:
    label: "Lifeline"
    roots: [lifeline]
  liheap:
    label: "LIHEAP (the SPM energy subsidy input)"
    roots: [spm_unit_energy_subsidy]
  medicaid:
    label: "Medicaid"
    roots: [medicaid]
  school_meals:
    label: "Free and reduced-price school meals"
    roots: [free_school_meals, reduced_price_school_meals]
  snap:
    label: "SNAP"
    roots: [snap]
  ssi:
    label: "SSI"
    roots: [ssi]
  state_benefits:
    label: "State means-tested benefits (household_state_benefits)"
    roots: [household_state_benefits]
  tanf:
    label: "TANF, the federal total of every state program"
    roots: [tanf]
  wic:
    label: "WIC"
    roots: [wic]
entries:
  - entity: person
    column: attends_eligible_educational_institution_for_american_opportunity_credit
    fill_value: "False"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      One of five American opportunity credit (AOTC) conditions, all False on ACS rows
      because the ACS asks none of them, so no ACS student claims the AOTC and qualified
      tuition goes to the lifetime learning credit instead.
    consumers: [aca_ptc, chip, ctc, general_assistance, lifeline, medicaid,
      state_benefits, wic]
    notes:
      - programs: [ctc]
        verdict: known_bias
        direction: mixed
        note: >-
          The CTC reads education credits only as nonrefundable credits ahead of it in
          its tax-liability limit (ctc_limiting_tax_liability). With the lifetime
          learning credit in place of the AOTC's nonrefundable part, that limit moves a
          little either way, and only where tax liability binds the CTC.
      - programs: [aca_ptc, chip, general_assistance, lifeline, medicaid,
          state_benefits, wic]
        verdict: harmless
        note: >-
          Reached only through the tax-liability chain: nonrefundable credits ahead of
          the CTC, then refundable_ctc, eligible_for_refundable_credits and
          tax_unit_is_filer, which Medicaid's non-filer rules and the PTC's filing
          condition read, and programs that read Medicaid enrollment. A change in tax
          liability moves the refundable CTC to or from zero only for a unit with
          positive income tax, which is already required to file, so the filer flag and
          everything past it do not change. County general assistance subtracts income
          tax or payroll withholding from earnings (Santa Clara, Marin, Los Angeles),
          but its applicants owe almost none.
  - entity: person
    column: cps_race
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      CPS race code. Read only by race, a demographic label no means-tested program
      reads (ACS RAC1P could fill it natively).
    consumers: []
    notes: []
  - entity: person
    column: detailed_occupation_recode
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: "No policyengine-us 2.2.1 variable reads it."
    consumers: []
    notes: []
  - entity: person
    column: educational_assistance
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      Scholarships, grants and other educational assistance received; no ACS item
      isolates it. SNAP does not count it.
    consumers: [general_assistance, school_meals, state_benefits, wic]
    notes:
      - programs: [school_meals, wic]
        verdict: known_bias
        direction: overstates
        note: >-
          Both count educational assistance as income
          (gov.usda.school_meals.income.sources, gov.usda.wic.income.sources). At 0,
          families with a student receiving aid look slightly poorer, so eligibility is
          slightly overstated.
      - programs: [general_assistance, state_benefits]
        verdict: known_bias
        direction: overstates
        note: >-
          Orange County and San Bernardino County general relief count it as unearned
          income; California's CVRP increased rebate reads the school-meal income ratio
          and CARE reads WIC receipt, so they inherit the same small overstatement.
  - entity: person
    column: employment_income_before_lsr
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "ACS persons under 15, outside the WAGP universe"
    summary: >-
      Wages before labor-supply responses. ACS WAGP is asked from age 15, so only
      persons under 15 are filled.
    consumers: [aca_ptc, chip, ctc, eitc, general_assistance, head_start,
      housing_assistance, lifeline, medicaid, school_meals, snap, ssi, state_benefits,
      tanf, wic]
    notes:
      - programs: [aca_ptc, chip, ctc, eitc, general_assistance, head_start,
          housing_assistance, lifeline, medicaid, school_meals, snap, ssi,
          state_benefits, tanf, wic]
        verdict: harmless
        note: >-
          0 is the source-consistent value: WAGP is not asked below age 15, and the
          certified ASEC frame also carries an explicit zero there
          (acs_income_universe).
  - entity: person
    column: fsla_overtime_premium
    fill_value: "0"
    spines: [acs_2024_1yr]
    rows: "every ACS person"
    summary: >-
      FLSA overtime premium, which the ACS does not separate from WAGP. Read by the
      federal overtime deduction (tax years 2025-2028, P.L. 119-21) and Georgia's
      overtime exclusion.
    consumers: [aca_ptc, chip, ctc, general_assistance, lifeline, medicaid,
      state_benefits, wic]
    notes:
      - programs: [ctc]
        verdict: known_bias
        direction: overstates
        note: >-
          No effect for 2024. From tax year 2025 the missing overtime deduction leaves
          ACS taxable income and tax too high, which leaves more room for the
          nonrefundable CTC, so the CTC is weakly overstated where tax liability limits
          it.
      - programs: [aca_ptc, chip, general_assistance, lifeline, medicaid,
          state_benefits, wic]
        verdict: harmless
        note: >-
          A below-the-line deduction leaves AGI and MAGI unchanged. Reached only through
          the tax-liability chain: nonrefundable credits ahead of the CTC, then
          refundable_ctc, eligible_for_refundable_credits and tax_unit_is_filer, which
          Medicaid's non-filer rules and the PTC's filing condition read, and programs
          that read Medicaid enrollment. A change in tax liability moves the refundable
          CTC to or from zero only for a unit with positive income tax, which is already
          required to file, so the filer flag and everything past it do not change.
          County general assistance subtracts income tax or payroll withholding from
          earnings (Santa Clara, Marin, Los Angeles), but its applicants owe almost
          none.
