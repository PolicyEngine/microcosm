    rows: "every ACS tax unit"
    summary: >-
      Runtime-owned take-up flag, not seeded on ACS rows (reviewed limitation
      acs_take_up_engine_defaults).
    consumers: [aca_ptc]
    notes:
      - programs: [aca_ptc]
        verdict: known_bias
        direction: overstates
        note: >-
          Universal take-up: assigned_aca_ptc is the full credit for every eligible ACS
