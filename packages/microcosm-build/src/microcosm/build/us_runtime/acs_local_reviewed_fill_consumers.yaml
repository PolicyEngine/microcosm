      - programs: [ssi]
        verdict: harmless
        note: >-
          Reached only through the 2020-only charitable deduction for non-itemizers
          (charitable_contributions_ald), which is 0 before it reads anything in any
          other year, and/or the contributed COLA means test
          (social_security_cola_means_test_withheld), which is False unless
