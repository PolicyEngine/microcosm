legacy_contract_metadata:
  policy: 'Take-up contract inventory for PolicyEngine-US take-up flags. Each program records the engine
    facts a test asserts against the installed policyengine-us (entity, default, engine_class) and the
    curated populace treatment (seed / rate_unsourced / model_simulated / out_of_scope / near_universal)
    with its administrative rate provenance. The engine facts are derived, not remembered: PolicyEngineUSEngine.take_up_contract()
    recomputes them from engine metadata and test_us_take_up_contract.py fails when a checked-in engine
    fact drifts from the pinned engine (same doctrine as the #301 formula-owned guard). populace issue
    #312.'
  asserted_engine:
    package: policyengine-us
    constraint: '>=1.745.0,<2'
    inventory_built_against: 1.752.2
    note: engine_class, entity, value_type, and default below are asserted against the installed engine
      by test. inventory_built_against records the version the curated treatments were reviewed against;
      the pin constraint is the contract the build honors.
  doctrine:
    engine_class: Derived from engine metadata. model_simulated = policyengine-us computes the flag itself
      (formula / adds / start-date formula); populace must NOT seed it. data_seeded = a default-True input
      leaf policyengine-us reads from data; without a dataset value every eligible unit takes up (mechanical
      100% participation). dead = no downstream variable reads the flag; seeding it changes no output.
    populace_treatment: 'Curated per-program decision. seed = populace assigns the flag from an administrative
      participation rate with cited provenance. count_calibrated = no administrative participation rate
      exists, but administrative enrollment counts do: populace anchors the flag on survey-reported coverage
      and calibrates the fill to those count facts (the native ACA stage pattern), so no rate is ever
      cited and the model-relative-ratio class stays out of the inventory; the entry''s calibration block
      names the anchor column and target fact families. rate_unsourced = the flag is data_seeded but no
      administrative rate is traceable to a federal agency publication, so it is left unseeded and stays
      a #313 parity-gate exemption until the rate is sourced (ideally as a Ledger fact); copying us-data''s
      unsourced value would recreate the fabricated-rate class ledger#77 removed. out_of_scope = handled
      by another workstream. near_universal = the administrative reality is ~100% take-up, so seeding
      sub-100% would be the error.'
    provenance_rule: A rate may only drive a seed stage when its exact value is traceable to an administrative
      source (FNS/CMS/IRS/ACF/ASPE publication) at a stated vintage. Research-institute-only estimates
      (e.g. NIEER, unadjusted Urban microsimulation outputs) and model-relative ratios (admin numerator
      over a policyengine eligibility estimate) do not clear the bar and are recorded rate_unsourced.
    enrollment_semantics: 'Enrollment take-up flags carry point-in-time (average-month) semantics: anchored
      on interview-point survey coverage and calibrated to month-tagged administrative enrollment snapshots,
      never to ever-enrolled-in-year counts (which run ~10M+ higher for Medicaid and would overstate spending
      against per-full-year-equivalent cost denominators). Precedent: Urban HIPSM targets the CMS point-in-time
      snapshot ''rather than an annual average'' (HIPSM 2020 methodology). Within-year churn is out of
      scope for take-up stages (longitudinal frame direction, DESIGN.md). populace #332.'
