channels:
- id: asec
  source: asec_raw_stage
  observed_geography: state
- id: acs
  source:
  - acs_household
  - acs_person
  observed_geography: puma
assembly:
  mass_anchor_channel: asec
  shared_dtype_policy: canonical_string_storage
  household_mass_shares:
    asec: 0.5
    acs: 0.5
sampling:
  channels:
  - asec
  - acs
  grain: household
  fraction:
    surface: run_request
    default: 1.0
    rungs_ref:
      domain: publication
      pointer: /release/rung_fractions
  seed:
    surface: run_request
    default: 578
    streams:
      asec: stream:sampling_asec
      acs: stream:sampling_acs
    same_value_new_generator_per_channel: true
  exact_count_rule: floor(fraction * eligible)
  inventory_order: sorted_household_id
  rng: numpy.default_rng.choice_without_replacement
  full_fraction_is_noop: true
  normalize_each_channel_to_full_source_household_mass: true
support_roles:
- id: puf_tax_detail
  kind: puf_attachment
  clone_index: 1
  attachment:
    fraction:
      surface: run_request
      default: 1.0
    seed:
      surface: run_request
      stream: stream:puf_clone_attachment
      default: 578
  tail_support:
    strata: filing_status
    policy: declared_min_support_with_receipt
    manifest_schema_version: 2
    legacy_contract:
      contract_id: puf_capital_gains_tail_per_filing_status_support
      version: 1
      partition: filing_status
      filing_statuses:
      - filing_status_code: 1
        filing_status: SINGLE
      - filing_status_code: 2
        filing_status: JOINT
      - filing_status_code: 3
        filing_status: SEPARATE
      - filing_status_code: 4
        filing_status: HEAD_OF_HOUSEHOLD
      - filing_status_code: 5
        filing_status: SURVIVING_SPOUSE
      candidate_universe: unique single-tax-unit PUF-detail recipient households with weight capacity
        for the global maximum assigned tail-donor weight
      required_minimum: selected_q99_5_tail_donor_count_in_filing_status
      insufficient_support_action: skip_entire_filing_status_attachment_without_widening
      agi_band_policy: nearest_band_first_then_all_agi_bands_within_filing_status
      agi_band_count: 22
support_source_pool_metadata:
  version: 1
  country: us
  policy: US support-spine sources are declared as period-relative primary-source inputs. Local file paths
    are runtime build inputs; this manifest owns the source-year roles, shares, and citations.
support_source_pool:
  stage: asec_load
  method: pool_raw_asec_years
  target_year_from_build_config: true
  sources:
  - role: current_asec
    survey: CPS ASEC
    source: https://www.census.gov/programs-surveys/cps.html
    source_year_offset: 0
    share: 0.5
    notes: Target-year CPS ASEC source file; population mass is anchored to the target-year source.
  - role: prior_asec
    survey: CPS ASEC
    source: https://www.census.gov/programs-surveys/cps.html
    source_year_offset: -1
    share: 0.5
    notes: Prior-year CPS ASEC source file pooled before unit assignment to expand support while preserving
      total population mass.
