- stage: immigration_status
  survey: CPS ASEC + published unauthorized-population estimates
  source: https://www.pewresearch.org/short-reads/2024/07/22/what-we-know-about-unauthorized-immigrants-living-in-the-us/
  grain: person
  artifacts:
  - kind: public_microdata
    format: census_asec
    vintage: build_year
    locator: Census CPS ASEC person file citizenship (PRCITSHP), entry year (PEINUSYR), nativity (PENATVTY),
      and program-participation fields
  - kind: administrative_table
    format: published_estimate
    vintage: latest_available
    locator: Pew Research Center unauthorized-immigrant population and worker estimates; Higher Ed Immigration
      Portal undocumented-student estimates
  operations:
  - kind: read_table
    table: person
    weight: person_weight
  - kind: derive_immigration_status
    seed_from_build_config: true
    time_period_from_build_config: true
    undocumented_workers:
      target: 8300000
      source: https://www.pewresearch.org/short-reads/2024/07/22/what-we-know-about-unauthorized-immigrants-living-in-the-us/
    undocumented_students:
      target: 408000
      source: https://www.higheredimmigrationportal.org/research/undocumented-students-in-higher-education-updated-march-2021/
    undocumented_population_anchor:
      value: 11000000
      source: https://www.pewresearch.org/short-reads/2024/07/22/what-we-know-about-unauthorized-immigrants-living-in-the-us/
  outputs:
  - ssn_card_type
  - immigration_status_str
  notes: 'Citizenship is measured (PRCITSHP), not imputed. Non-citizens with any ASEC-UA legal-status
    indicator (Van Hook et al., SSRN 4662801) become OTHER_NON_CITIZEN. The CPS carries no work-authorization
    variable, so among residual non-citizens, workers and students spill to NON_CITIZEN_VALID_EAD in deterministic
    seeded order until the remaining undocumented worker count matches Pew''s 8.3M and the undocumented
    student count matches the Higher Ed Immigration Portal''s ~408k — the only forced margins. The total
    undocumented population is emergent (≈13M on the 2024 ASEC, within the range of published 2023-24
    estimates) and is gated against Pew''s 11.0M 2022 anchor with a coarse plausibility band rather than
    forced; reconciling the level is the calibration lane''s job. Immigration-status tags carry only statutory
    tests the data supports: DACA (arrival cohort among EAD holders) and CUBAN_HAITIAN_ENTRANT (nativity
    plus post-1980 arrival); other documented non-citizens stay LEGAL_PERMANENT_RESIDENT, the modal true
    status — blanket REFUGEE/TPS labels are deliberately not fabricated because they would mislabel millions
    and over-grant refugee-class benefit exemptions.'
- stage: hours_worked
  survey: Census CPS ASEC
  source: https://www.census.gov/programs-surveys/cps.html
  grain: person
  artifacts:
  - kind: public_microdata
    format: census_asec
    vintage: build_year
    locator: Census CPS ASEC person file usual weekly hours (HRSWK), reference-week hours (A_HRS1), and
      weeks worked (WKSWORK)
  operations:
  - kind: read_table
    table: person
  - kind: derive_hours_worked
  outputs:
  - weekly_hours_worked_before_lsr
  - hours_worked_last_week
  - weeks_worked
  nonnegative_outputs:
  - weekly_hours_worked_before_lsr
  - hours_worked_last_week
  - weeks_worked
  notes: 'Direct mappings of measured ASEC hours variables, identical to the retired enhanced-CPS pipeline:
    weekly_hours_worked_before_lsr <- HRSWK (usual hours per week last year, 0 for non-workers), hours_worked_last_week
    <- A_HRS1, and weeks_worked <- WKSWORK clipped to [0, 52]. Nothing is imputed. The legacy fiscal-refresh
    path retains all three columns because ORG/FLSA consumes weeks_worked and the 2024 period-scoped export
    guard permits it; the multispine pool wrapper projects canonical weeks_worked away after this shared
    kernel runs while retaining raw WKSWORK evidence. Without this stage PolicyEngine-US defaults every
    person to 40 weekly hours, so the SNAP 30-hour general and 20-hour ABAWD work requirements pass universally
    (microcosm #242/#248). HRSWK is an annual usual-hours measure while the ABAWD standard is a monthly
    80-hour test; week-by-week volatility is not observable in the CPS and is deliberately out of scope.'
- stage: snap_take_up
  survey: Census CPS ASEC + USDA FNS participation rate estimates
  source: https://www.fns.usda.gov/snap/participation-rates
  grain: spm_unit
  artifacts:
  - kind: public_microdata
    format: census_asec
    vintage: build_year
    locator: Census CPS ASEC SPM unit reported SNAP subsidy (SPM_SNAPSUB)
  - kind: administrative_table
    format: published_estimate
    vintage: latest_available
    locator: USDA FNS SNAP participation-rate estimates (Reaching Those in Need)
  operations:
  - kind: read_table
    table: person
  - kind: derive_snap_take_up
    seed_from_build_config: true
    take_up_rate:
      value: 0.82
      source: https://www.fns.usda.gov/snap/participation-rates
  outputs:
  - takes_up_snap_if_eligible
  notes: 'Reported recipients (SPM_SNAPSUB > 0) always take up — survey measurement first. Non-reporting
    units receive seeded draws at exactly the rate needed for the overall weighted take-up share to land
    on the cited FNS participation rate; when reporters alone exceed the rate the share is emergent. The
    flag is assigned across all SPM units and the engine intersects it with modeled eligibility, matching
    the retired enhanced-CPS pipeline. Draws are keyed by stable source identity so support-channel clones
    of one source unit always agree. Without this stage the engine defaults every unit to take-up (100%
    participation), overstating the reach of eligibility-side reforms (microcosm #243). The national fill
    is an assignment prior: the snap_state_take_up stage recalibrates it per state to FNS caseloads (microcosm
    #372).'
- stage: snap_state_take_up
  survey: Census CPS ASEC reported receipt + USDA FNS state average-monthly household caseloads
  source: https://www.fns.usda.gov/pd/supplemental-nutrition-assistance-program-snap
  grain: spm_unit
  artifacts:
  - kind: public_microdata
    format: census_asec
    vintage: build_year
    locator: Census CPS ASEC SPM unit reported SNAP subsidy (SPM_SNAPSUB)
  - kind: administrative_table
    format: published_estimate
    vintage: fiscal_year_2024
    locator: USDA FNS SNAP average monthly households by state (usda_snap.fy2024.state_average_monthly_households.*)
  operations:
  - kind: read_table
    table: spm_unit
    weight: spm_unit_weight
  - kind: assign_binary_from_rate
    output: takes_up_snap_if_eligible
    draw: stable_spm_unit_draw
    rate_key: snap
    rate_column: snap_take_up_rate
    reported_true_anchor: snap_reported_receipt
  - kind: calibrate_binary_assignment
    variable: takes_up_snap_if_eligible
    targets:
    - usda_snap_households_by_state
    preserve_true_anchors: true
    preserve_true_anchor: snap_reported_receipt
    domain: is_snap_eligible
    weight: spm_unit_weight
    draw: stable_spm_unit_draw
  outputs:
  - takes_up_snap_if_eligible
  notes: 'Anchored count-calibration to FNS state caseloads (microcosm #372), following the medicaid_take_up
    pattern at SPM-unit grain. Reported recipients always take up; the fill draws at an in-build state
    rate (FNS average-monthly household count over weighted modeled-eligible units, an assignment prior,
    never cited as provenance) and is greedily calibrated to the FNS FY2024 state counts among eligible
    non-anchored units. Caseload semantics are fiscal-year average-monthly stocks - the same rows the
    snap_households weight-calibration targets compile from, so the seed and the calibration objective
    agree. CPS receipt underreporting is strongly state-dependent, so the national snap_take_up fill leaves
    the worst-underreporting states short of taker households no reweighting can recover. The assign operation
    deliberately carries no eligibility mask: off-domain units keep a draw-based propensity so eligibility-expanding
    reforms do not inherit a hard-coded zero response. States whose FNS count meets or exceeds modeled
    eligible weight saturate (all eligible units take up) and are recorded as saturated in diagnostics,
    not failed. Persons caseloads are deliberately untargeted: the SNAP assistance unit is often a subset
    of the SPM unit, so member counts overcount FNS participants by roughly half.'
