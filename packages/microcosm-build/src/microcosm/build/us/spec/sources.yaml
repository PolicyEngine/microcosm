    seed, which accidentally made the pregnant rate unreachable. The hermetic sources carry no breastfeeding
    assessment, so breastfeeding remains unavailable and mothers of infants use FNS''s all-postpartum
    rate rather than an invented breastfeeding status. Stable source-identity hashes preserve paired support-clone
    outcomes. The separate is_wic_at_nutritional_risk input remains a reviewed source-unavailability exclusion.'
- stage: snap_abawd_discretionary_exemption
  survey: Census CPS ASEC + statutory exemption cap (7 U.S.C. 2015(o)(6))
  source: https://www.law.cornell.edu/uscode/text/7/2015#o_6
  grain: person
  artifacts:
  - kind: public_microdata
    format: census_asec
    vintage: build_year
    locator: Census CPS ASEC person file age (A_AGE)
  - kind: administrative_table
    format: published_estimate
    vintage: latest_available
    locator: 'Statutory ABAWD discretionary exemption cap: 8% of covered individuals from FY2024 (7 U.S.C.
      2015(o)(6); 15% FY1998-2019, 12% FY2020-23)'
  operations:
  - kind: read_table
    table: person
  - kind: derive_snap_abawd_discretionary_exemption
    seed_from_build_config: true
    exemption_rate:
      value: 0.08
      source: https://www.law.cornell.edu/uscode/text/7/2015#o_6
  outputs:
  - is_snap_abawd_discretionary_exempt
  notes: 'State agencies may exempt a monthly-average share of ABAWD-covered individuals from the SNAP
    time limit (7 U.S.C. 2015(o)(6)): 8% from FY2024 (15% FY1998-2019, 12% FY2020-23) — the cap PolicyEngine-US
    carries as gov.usda.snap.work_requirements.abawd.discretionary_exemption_rate. Coverage is engine
    logic the build must not duplicate, so the flag is seeded with stable blake2b draws across the potentially
    covered population (adults 18-64) and the engine intersects it with modeled coverage; draws being
    independent of coverage keeps the exempt share among covered individuals at the statutory rate in
    expectation. Seeding at the cap assumes full state usage, which overstates actual practice: USDA reporting
    shows states typically use well under the allotment (exemption usage exceeded the cap in only five
    state-year instances across FY2016-19), so this is an upper bound on the discretionary channel; refining
    toward USDA exemption-usage reports is follow-up under microcosm #323. Without this stage the input
    defaults to False and the discretionary channel never fires (microcosm #323).'
