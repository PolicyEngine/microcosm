    ''>29 million'' TY2025 claimant floor (sb0517/sb0553, rounded floors, not mintable as exact-valued
    ledger facts). The two-signal estimator makes usual weekly hours worked last year (HRSWK) the persistent-overtime
    leg — usual>threshold carries with the usual-hours share as annualizer — while usual<=threshold retains
    the retired reference-week snapshot leg unchanged: representative for steady schedules, under- or
    over-recovering an occasional overtimer''s annual premium depending on the sampled week (not an unbiased
    mass estimator), retained because it is the only measured signal for that population. On ASEC-channel
    rows HRSWK shares the retrospective year with employment_income and weeks_worked; on PUF-support-channel
    rows both hours signals are donor-ASEC schedule proxies attached to PUF income, the support design''s
    property inherited equally by the reference-week leg. A frame whose ORG surface is already populated
    is fully re-imputed and compared on every entry: an identical surface passes through unchanged (the
    seeded QRF, deterministic union lottery, and pure derives make same-code re-entry byte-stable), and
    any stale construction of any output converges instead of silently surviving. The income-feature scaling
    also changes the deterministic union lottery''s hash inputs, so which individuals carry union coverage
    reshuffles within unchanged state-level quotas — the assignment method itself remains the exact archived
    port. Exemption screens unchanged; both hours measures count all jobs while FLSA section 7 applies
    per employer (inherited upward concept edge). Adjudication and measurements: microcosm#451 item 4
    overtime-incidence lane.'
