    format: census_asec
    vintage: hermetic ASEC pool years
    source: https://www.census.gov/programs-surveys/cps/data/datasets.html
    locator: Census CPS ASEC person PEDISDRS self-care difficulty item and the measured SPM-unit childcare
      expense distribution
  operations:
  - kind: read_table
    table: person
    weight: person_weight
  - kind: derive_adult_care_inputs
    self_care_difficulty_source: PEDISDRS
    childcare_expense_source: spm_unit_pre_subsidy_childcare_expenses
    full_time_student_source: is_full_time_college_student
    support_channel_source: person_support_channel
    child_qualifying_age_limit: 13
    earned_income_sources:
    - employment_income_before_lsr
    - self_employment_income_before_lsr
    - sstb_self_employment_income_before_lsr
    seed_from_build_config: true
    output_flag: is_incapable_of_self_care
    output_expenses: pre_subsidy_care_expenses
  outputs:
  - is_incapable_of_self_care
  - pre_subsidy_care_expenses
  nonnegative_outputs:
  - pre_subsidy_care_expenses
  notes: 'Section 21 CDCC adult/disabled-dependent care inputs (PolicyEngine/microcosm#451 item 1), previously
    structural zeros in both the retired eCPS and every Microcosm base. Source decision receipts (Census
    API variable dictionaries, ASEC 2024 and SIPP 2023, read 2026-07-22): ASEC carries the qualifying
    concept directly - person item PEDISDRS (''difficulty dressing or bathing'') operationalizes ''physically
    or mentally incapable of self-care'', with SIPP''s identical ESELFCARE item corroborating; NEITHER
    instrument''s current public-use release carries in-household adult-care expenditures: ASEC''s only
    care-expense items are childcare HCHCARE_VAL/SPM_CHILDCAREXPNS, and while the 2018 SIPP panel''s Child
    & Dependent Care topical module collected paid dependent-care fields (ECREPAYANYON, TDEPNDNTEXP),
    they are absent from the 2023 SIPP PUF dictionary (the pinned donor vintage), whose only adult-care
    payment amount TDPCAREAMT covers care of a former household member, failing section 21''s same-principal-abode
    requirement. The dollar leg is therefore an explicitly documented same-instrument proxy: the measured
    ASEC work-related childcare expense distribution (the same section 21 employment-related expense class,
    subject to the same 26 USC 21(c) per-person cap) supplies the paid-care usage rate and the positive
    level distribution (weighted quantiles, zero-weight donors excluded). The donor universe is measured
    at SPM-unit grain, where the childcare leaf lives: units with any member under the 21(b)(1)(A) age
    limit and any positive member earnings, on the measured ASEC channel - an approximation of the binding
    childcare population at donor grain, not a reproduction of the tax-unit minimum-earnings test. Recipient
    support is restricted to tax units where the statute can bind: a measured disabled qualifying individual
    under 21(b)(1)(B) (dependent) or 21(b)(1)(C) (married head or spouse), plus the 21(d) earnings structure
    computed exactly as the engine''s min_head_spouse_earned binds - both spouses earning, or a 21(d)(2)
    floor-eligible spouse (incapable of self-care, or the measured full-time college student via is_full_time_college_student)
    deemed while the OTHER spouse actually earns; deeming never rescues a unit whose only earner is the
    floor-eligible spouse. Selection is a seeded weight-targeted permutation prefix over sorted unit ids
    (invariant to person-row order) at the measured usage rate; levels are a distribution-preserving weighted-quantile
    draw whose grid is the selected units'' own cumulative-weight midpoints, placed on the qualifying
    person with the smallest person_id. PolicyEngine-US 1.819.0 owns all downstream CDCC formulas; is_incapable_of_self_care
    is also consumed by SNAP/Medicaid work-requirement logic and multiple state dependent-care formulas,
    moving those programs from flag-off defaults toward the measured disability structure.'
