    and 6 -> taxable SEP. Archived imputation_parameters.yaml lines 10-15 sets the 401(k), 403(b), regular-IRA,
    and SEP taxable fractions to 1.0; Keogh is directly taxable in the engine aggregate. Code 7 has no
    PolicyEngine-US leaf and is deliberately not allocated. After support expansion, the retired second
    stage (extended_cps.py lines 140-148, 639-745, and 1014-1073) QRF-imputes, among these six populated
    leaves, taxable 401(k), taxable 403(b), Keogh, and taxable SEP onto the PUF half. Its three tax-exempt
    employer-account companions remain zero under the 1.0 taxable shares and lie outside the populated
    coverage surface. The measured ASEC half remains exact, PUF-sourced taxable IRA is preserved, and
    tax-exempt Roth IRA remains a direct copied ASEC mapping. No uncited allocation or redraw is introduced.'
- stage: eligibility_inputs
  survey: Census CPS ASEC
  source: https://www.census.gov/programs-surveys/cps.html
  grain: person
  artifacts:
  - kind: public_microdata
    format: census_asec
    vintage: build_year
    locator: Census CPS ASEC person file disability-difficulty items (PEDISDRS/PEDISEAR/PEDISEYE/PEDISOUT/PEDISPHY/PEDISREM),
      school enrollment (A_HSCOL, A_FTPT), parent line pointers (PEPAR1, PEPAR2), veterans' payments (VET_VAL),
      and reported SSI (SSI_VAL)
  operations:
  - kind: read_table
    table: person
  - kind: derive_eligibility_inputs
  outputs:
  - is_disabled
  - is_blind
  - is_full_time_college_student
  - own_children_in_household
  - veterans_benefits
  nonnegative_outputs:
  - own_children_in_household
  - veterans_benefits
  notes: 'Direct mappings of measured ASEC demographic variables reproducing the retired enhanced-CPS
    pipeline''s constructions (each cited to the retired pipeline''s source files in the stage module):
    is_disabled <- any PEDIS* difficulty item == 1, aligned with reported SSI (under-65 SSI_VAL > 0 implies
    disabled — the retired align_reported_ssi_disability rule from datasets/cps/takeup.py, applied to
    is_disabled in cps.py); is_blind <- PEDISEYE == 1; is_full_time_college_student <- A_HSCOL == 2 &
    A_FTPT == 1 (the retired primary branch; census_cps.py loads A_FTPT, so the published surface ran
    the strict form — the A_HSCOL-only fallback for loads without A_FTPT is not reproduced); own_children_in_household
    <- count of household members whose PEPAR1/PEPAR2 parent pointers resolve to the person within PH_SEQ;
    veterans_benefits <- VET_VAL. Nothing is imputed. Without this stage every input takes its engine
    default (False/0), erasing SNAP disability, student, parent/child, and veteran exemption channels
    (microcosm #244/#248). is_veteran is formula-owned in PolicyEngine-US (derived from veterans_benefits)
    and is deliberately not exported (microcosm #24).'
