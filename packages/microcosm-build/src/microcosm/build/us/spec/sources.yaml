  notes: 'PUF detail is a primary-source donor and must stay separate from benchmark comparisons. The
    pinned PUF lineage uprates the raw TY2015 rows before replacing the four IRS disclosure aggregate
    records (archived puf.py lines 1378-1398). Its seed-42 disaggregator enables the Forbes backbone for
    aggregate RECID 999999 (archived disaggregate_puf.py lines 55-60 and 85-123), producing the 3,900-record
    open tail retained by puf_2024.h5. This build consumes that versioned H5 and does not request unsupported
    Forbes synthesis from the source-stage runtime. Qualified tuition reproduces the retired source transform
    as max(E03230, E87530), falling back to E03230 when the optional field is absent. Educator expense
    reproduces the retired direct mapping educator_expense = E03220 at archived commit 42ed5d45c56df80d754fbe24cce21cfeb8d05cbe,
    datasets/puf/puf.py lines 636-649, with filer/spouse allocation by earnings share at lines 617-620
    and export at lines 804-815; the processed 1.8.0 artifact carries the leaf. Microcosm places this
    PUF-only detail on its dedicated PUF support channel and sparsifies to the donor positive rate, rather
    than reproducing the retired both-half override. Form 4952 elected investment income reproduces the
    archived direct mapping investment_income_elected_form_4952 = E58990 at puf.py line 708, its export
    at lines 804-850, and its retired QRF target/override entries at calibration/puf_impute.py lines 90-198;
    the pinned processed 1.8.0 artifact carries nondefault source signal. SALT refund income reproduces
    the archived direct mapping salt_refund_income = E00700 at puf.py line 707, its export at lines 804-850,
    and its retired QRF target/override entries at calibration/puf_impute.py lines 90-198; the pinned
    processed 1.8.0 artifact carries nondefault source signal. The retired processed person array embodies
    a randomized EARNSPLIT filer/spouse allocation (puf.py lines 477-546 and 1513-1601), but the hermetic
    ASEC target has no EARNSPLIT. Microcosm aggregates each processed donor person leaf to a tax-unit
    QRF target and sparsifies only the PUF support channel to the donor positive rate. Predicted person-output
    totals are redistributed using copied ASEC within-unit shares or leaf-specific allocation bases, with
    a stable first-person fallback only where the target support has no allocation mass; this preserves
    person-sensitive caps and eligibility where a defensible allocation basis exists. Alimony reproduces
    the retired direct PUF mappings alimony_income = E00800 and alimony_expense = E03500 at archived commit
    42ed5d45c56df80d754fbe24cce21cfeb8d05cbe, datasets/puf/puf.py lines 640-641, and is re-derived after
    aggregate-row disaggregation; reported ASEC OI_VAL with OI_OFF = 20 remains on the ASEC half while
    codes 20 (alimony) and 12 (strike benefits) are excluded from miscellaneous_income per datasets/cps/cps.py
    lines 1481-1492. Domestic production reproduces the retired direct mapping domestic_production_ald
    = E03240 at archived puf.py line 646, appears in the exported field list at lines 808-815, and is
    re-derived after aggregate-row disaggregation; it is the former Section 199 deduction, not Section
    199A QBI. The retired weighted-QRF target and override lists include it at calibration/puf_impute.py
    lines 90-198, with the fit at lines 940-1075. Casualty loss reproduces the retired direct mapping
    casualty_loss = E20500 at the same commit, datasets/puf/puf.py lines 636-643, and is re-derived after
    aggregate-row disaggregation. Unreimbursed employee business expenses reproduce the archived E20400
    proxy for all deductible miscellaneous expenses at the same commit, datasets/puf/puf.py lines 663-665,
    and are likewise re-derived after disaggregation. Signed farm business inputs reproduce farm_operations_income
    = E02100 and farm_rent_income = E27200 at archived puf.py lines 636-704 and are re-derived after disaggregation
    without clipping; ASEC farm_operations_income = FRSE_VAL at archived cps.py lines 1363-1382 remains
    measured on that channel, while PUF farm_income = T27800 is a distinct Schedule J leaf and a forbidden
    substitute. The retired farm QRF overwrote both clone halves (calibration/puf_impute.py lines 513-672);
    Microcosm deliberately preserves measured ASEC operations income and replaces only the PUF support
    channel. Section 199A inputs are carried from the versioned processed PUF artifact rather than redrawn:
    archived puf.py lines 105-405 define the seeded qualification, investment-income, SSTB, W-2, and UBIA
    simulations; lines 748-787 enforce the all-or-nothing SSTB split; lines 860-879 export the 15 leaves;
    qbi_assumptions.yaml lines 1-118 pin the assumptions; calibration/puf_impute.py lines 90-198 and 940-1075
    pin the retired QRF targets and fit. Microcosm source-aligns boolean person counts and restores the
    archived split/exposure identities after its weighted PUF QRF.'
