  nonnegative_outputs:
  - selected_marketplace_plan_benchmark_ratio
  notes: When PolicyEngine-US separates observed Marketplace coverage from simulated take-up, this stage
    should write the simulated take-up input while reported coverage remains a CPS-carried person-level
    input.
- stage: medicaid_take_up
  survey: CPS ASEC reported coverage + CMS Medicaid monthly enrollment snapshot
  source: https://data.medicaid.gov/dataset/6165f45b-ca93-5bb5-9d06-db29c692a360
  grain: person
  artifacts:
  - kind: public_microdata
    format: census_asec
    vintage: build_year
    locator: CPS ASEC current Medicaid coverage at interview (has_medicaid_health_coverage_at_interview)
  - kind: administrative_table
    format: cms_enrollment_snapshot
    vintage: month2024_12
    locator: CMS Medicaid and CHIP monthly enrollment, December 2024 state snapshot (cms_medicaid.month2024_12.state_enrollment.*.total_medicaid_enrollment)
  operations:
  - kind: read_table
    table: person
    weight: person_weight
  - kind: assign_binary_from_rate
    output: takes_up_medicaid_if_eligible
    draw: stable_person_draw
    rate_key: medicaid
    rate_column: medicaid_take_up_rate
    reported_true_anchor: has_medicaid_health_coverage_at_interview
  - kind: calibrate_binary_assignment
    variable: takes_up_medicaid_if_eligible
    targets:
    - cms_medicaid_enrollment_by_state
    preserve_true_anchors: true
    preserve_true_anchor: has_medicaid_health_coverage_at_interview
    domain: is_medicaid_eligible
    weight: person_weight
    draw: stable_person_draw
  outputs:
  - takes_up_medicaid_if_eligible
  notes: 'Anchored count-calibration (take-up contract treatment: count_calibrated; microcosm #331). Eligible
    reporters always take up; the fill draws at an in-build state rate (CMS count over weighted modeled
    eligibles, an assignment prior, never cited as provenance) and is greedily calibrated to the CMS December
    2024 state snapshot among eligible non-anchored persons. Point-in-time (average-month) enrollment
    semantics per #332 - never ever-enrolled-in-year counts. The assign operation deliberately carries
    no eligibility mask: off-domain persons keep a draw-based propensity so eligibility-expanding reforms
    do not inherit a hard-coded zero response; the engine''s is_medicaid_eligible gate hides the flag
    at baseline. States whose CMS count meets or exceeds modeled eligible weight saturate (all eligibles
    enroll) and are recorded as saturated in diagnostics, not failed (#170''s eligibility-undercount shortfall
    is out of scope). CHIP deliberately excluded pending the #321 M-CHIP/separate-CHIP ledger concept
    split.'
- stage: other_health_insurance_premiums
  survey: Census CPS ASEC
  source: https://www.census.gov/programs-surveys/cps.html
  grain: person
  artifacts:
  - kind: public_microdata
    format: census_asec
    vintage: hermetic ASEC pool years (2022-2024 for target 2024)
    source: https://www.census.gov/programs-surveys/cps/data/datasets.html
    locator: Census CPS ASEC person PHIP_VAL reported premium, carried as health_insurance_premiums_without_medicare_part_b
  operations:
  - kind: read_table
    table: person
    weight: person_weight
  - kind: derive_other_health_insurance_premiums
    reported_source: health_insurance_premiums_without_medicare_part_b
    chip_premium_source: chip_premium
    marketplace_net_premium_source: marketplace_net_premium
    medicaid_premium_source: medicaid_premium
    output: other_health_insurance_premiums
  - kind: impute_other_health_insurance_premiums_to_puf_support
    predictors:
    - age
    - is_male
    - has_esi
    - tax_unit_is_joint
    - tax_unit_count_dependents
    - employment_income
    - self_employment_income
    - social_security
    max_train_samples: 5000
    n_estimators: 100
    seed_from_build_config: true
    weight: person_weight
  - kind: attribute_self_employed_health_premiums
    reported_source: health_insurance_premiums_without_medicare_part_b
    self_employment_income_sources:
    - self_employment_income_before_lsr
    - sstb_self_employment_income_before_lsr
    medicare_age_source: age
    medicare_age_threshold: 65
    medicare_ssdi_source: social_security_disability
    employer_coverage_source: has_esi
    output_premiums: health_insurance_premiums
    output_self_employed_flag: is_self_employed
  outputs:
  - health_insurance_premiums_without_medicare_part_b
  - other_health_insurance_premiums
  - health_insurance_premiums
  - is_self_employed
  nonnegative_outputs:
  - health_insurance_premiums_without_medicare_part_b
  - other_health_insurance_premiums
  - health_insurance_premiums
  notes: 'After ACA and Medicaid take-up inputs are materialized, the retired annual residual is max(PHIP_VAL
    - chip_premium - marketplace_net_premium - medicaid_premium, 0), with tax-unit modeled premiums assigned
    to the first person (archived commit 42ed5d45c56df80d754fbe24cce21cfeb8d05cbe, datasets/cps/cps.py
    lines 828-944). The archived CPS-only output list and exact eight-predictor, at-most-5,000-person
    joint QRF are extended_cps.py lines 135-194, 234-248, and 639-745, with only the PUF support half
    replaced at lines 1014-1076. Because the archive predicted the two PUF leaves jointly without clipping
    one to the other, PUF-only residual-order exceedances remain diagnostics; measured ASEC rows must
    preserve the exact residual identity. The archive did not explicitly pin tree count or weights; Microcosm
    pins 100 trees and typed person weights as reproducibility hardening. The final attribution operation
    (PolicyEngine/microcosm#451 item 2) is deterministic: it copies the finished reported non-Part-B premium
    onto the person health_insurance_premiums input exactly where combined Schedule C income (self_employment_income_before_lsr
    + sstb_self_employment_income_before_lsr) is strictly positive, the person is outside the Medicare
    proxy (age 65+ or any Social Security disability income), and the person is outside measured employer-sponsored
