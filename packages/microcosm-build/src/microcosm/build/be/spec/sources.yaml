stage_manifest:
  version: 1
  country: be
  policy: Belgium transports the immutable public Microcosm US Build P support artifact into
    a synthetic Belgian population (BE-MC2). Donor records remain US support records and retain
    their support-stratum provenance; Belgian geography is assigned, never source-observed.
    Destination calibration uses Belgian administrative and national-accounts targets from
    sums of Chronicle facts; surveys are validation-only. The Chronicle consumer artifact
    and rulespec-be tree are declared unpinned placeholders, so this package remains inactive.
    Executable Python belongs in shared runtimes; publication remains private pending Max's
    decision in release_contract.json.
stages:
- stage: load_populace_us_support_pool
  survey: Microcosm US Build P support population (US donor support records)
  source: https://huggingface.co/datasets/policyengine/populace-us
  grain: person
  artifacts:
  - kind: public_microdata
    format: hdf5
    vintage: '2024'
    locator: populace_us_2024.h5
    revision: populace-us-2024-buildp-sparse-rmloss100-cae8640-20260728T011454Z
    repository:
      provider: huggingface
      owner: policyengine
      name_parts:
      - populace-us
      repo_type: dataset
    sha256: 48b9d479fb4fd1c3537f9383ce4697d130b6f618658409d74f6233c43b994c7e
    size_bytes: 462915783
    integrity_note: The revision is the immutable release tag named by the public latest.json
      pointer on 2026-08-29. Execution must verify both SHA-256 and byte size before reading;
      main/latest fallback is forbidden.
  - kind: public_aggregate_reference
    role: destination_chronicle_consumer_artifact_unpinned
    resource: chronicle_feed.json
    format: json
    runtime_sha256_required: true
  - kind: public_parameter_reference
    role: rulespec_be_tree_unpinned
    resource: axiom_rules_bindings.json
    format: json
  operations:
  - kind: read_tables
    tables:
    - person
    - household
    weight: household_weight
  outputs:
  - person_id
  - household_id
  - person_household_id
  - source_household_id
  - household_weight
  - support_stratum
  - donor_country_code
  - age
  - sex
  nonnegative_outputs:
  - household_weight
  - age
  notes: The first artifact copies the authenticated donor pin from build/nz/source_stages.json
    exactly. Shared transport must preserve donor entity ids, membership, typed household
    design weights and support strata, retain US donor provenance, and bridge donor mass to
    a Chronicle-supplied Belgian population total with a conservation receipt. The next two
    artifacts are declared placeholders for a PolicyEngine/chronicle consumer artifact and
    the TheAxiomFoundation/rulespec-be tree, respectively. Their referenced resources and
    exact facts/manifest hashes and RuleSpec commit/tree hashes are not authored or pinned
    here; neither reference permits execution or a latest/main fallback. Later work must supply
    those pins, source materialization, unit construction, engine bindings and an executable
    graph. Monetary conversion and quantile mapping are later declarations; monetary catalog
    columns wait for the shared EUR unit (PLAN S3).
