- key: person.employment_income
  contract:
    entity: person
    dtype: float64
    unit: eur
    definition_period: year
    vintage: vintage:be_target_2026
    nullable: false
    domain: donor_transported_money
    public_stability: internal
  docs:
    description: Donor wages and salaries in euros of the 2026 policy year, converted once
      from USD at the ECB annual reference rate for the donor year and then uprated (BE-MC3,
      proposed pending d1902). No producer until B4's currency bridge. The FPB gross-wage
      holdout in holdout_references.json measures it.
