phase: legacy
status: Contract-only declaration for household assignment to NIS 2025 communes from Chronicle
  package statbel-population-structure-commune-2025, PolicyEngine/chronicle#383 (approved
  and merging). Each household draws a commune nationally with Statbel population weights;
  province, region and community codes then derive and broadcast to persons. Belgian regions
  are assigned on US donor records, never source-observed. Reviewed functional concordances,
  including Brussels province and bilingual-community handling, and the exact consumer-artifact
  pin remain executable prerequisites. The existing kernel ids and generation-0 method are
  compatibility vocabulary only; detailed support facts remain in geography_spine.json. This
  declaration supplies no executable support rows or graph.
assignment:
  anchor: commune
  order: before_gap_fill
  kernels:
    assign: kernel:clone_assign_communes
    validate: kernel:be_commune_geography_gate
  draw:
    commune:
      universe: commune_nationally
      weight: statbel_population
  derive:
  - commune_nis
  - province_nis
  - region_nuts1
  - community_code
  assertions:
  - assigned_commune_complete
  - geography_vintage_exact
  ladder_source: source:be_commune_spine_contract
  seed: stream:geography_legacy
  default_seed: 0
  layer_vintages:
    commune: vintage:be_nis_2025
    province: vintage:be_province_2025
    nuts1: vintage:be_nuts1_2025
    community: vintage:be_community_2025
  validation:
  - commune_assignment_support
  - vintage_refusal
