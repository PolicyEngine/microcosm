    scope: direct raw-to-column E2 mappings only
  - kind: map_coded_amounts
    scope: region, tenure, accommodation, council tax band, benefit-code amount mappings
  - kind: annualize_periodic_amounts
    weeks_in_year: 52.17857142857143
