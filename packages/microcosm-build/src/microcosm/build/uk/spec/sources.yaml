    classification_rationale: Every published fact uses non-overlapping total-income bands. The FRS channel cannot materialize full TEI, and omitted income can move a person between bands, so neither an exact fact nor a per-band directional bound is valid.
    reviewed_fences:
    - fence_id: frs_epb_source_absent
      constituents:
      - EPB
      raw_sources_searched:
      - JOB.EXPBEN01-EXPBEN13
      - JOB.CARVAL
      - JOB.CARAMT
      - JOB.FUELAMT
      - JOB.VCHAMT
      - JOB.CHVAMT
      finding: Missing. EXPBEN* are receipt flags, and the amount fields cover only selected benefits; they cannot produce complete taxable expenses payments and benefits.
      mass_implication: 12.9485464% of certified-candidate FRS effective person mass has at least one receipt flag, but this is not monetary support.
      rationale: Receipt flags and selected benefit amounts cannot be promoted to the SPI EPB monetary concept without an imputation or proxy.
      dependent_fence_ids: []
    - fence_id: frs_exps_source_absent
      constituents:
      - EXPS
      raw_sources_searched:
      - JOB.EXPBEN04/EXPBEN05
      - JOB.MILEAMT/JOB.MOTAMT
      - JOB.UMILEAMT/JOB.UMOTAMT
      - JOB.DEDUC1-DEDUC9
      - JOB.UDEDUC1-UDEDUC9
      finding: Missing. These fields describe reimbursements or payroll deductions, not the complete tax-deductible employment-expense amount required by SPI.
      mass_implication: 5.1302528% of certified-candidate FRS effective person mass has an adjacent reimbursement flag; the true EXPS mass is not estimable.
      rationale: The nearby fields do not measure the required deductible amount, and EXPS enters the employed-income identity with a negative sign.
      dependent_fence_ids: []
    - fence_id: frs_taxterm_source_absent
      constituents:
      - TAXTERM
      raw_sources_searched:
      - ADULT.REDAMT
      - ADULT and JOB taxable-termination split search
      finding: Missing. REDAMT is gross redundancy pay and has neither the taxable amount nor non-redundancy termination pay.
      mass_implication: 0.3746084% of certified-candidate FRS effective person mass has positive gross redundancy pay; taxable mass is unknown.
      rationale: Gross redundancy pay cannot be relabeled as taxable termination pay.
      dependent_fence_ids: []
    - fence_id: frs_mothinc_source_absent
      constituents:
      - MOTHINC
      raw_sources_searched:
      - ODDJOB.OJAMT/ODDJOB.OJNOW
      - ADULT.ALLPAY2
      - ADULT.ROYYR2-ROYYR4
      - JOB.OWNOTHER
      finding: Missing. The fields are heterogeneous and belong to distinct income concepts; assigning their union to SPI miscellaneous employment income would be a proxy.
      mass_implication: Odd-job-only effective person mass is 0.1724207%; the broader unresolved miscellaneous pool is 1.4650566%.
      rationale: The FRS instrument cannot separate the SPI miscellaneous-employment concept source-faithfully.
      dependent_fence_ids: []
    - fence_id: frs_otherinc_source_absent
      constituents:
      - OTHERINC
      raw_sources_searched:
      - ADULT, ODDJOB, and JOB miscellaneous fields
      - PENSION
      - ACCOUNTS
      - ASSETS
      - BENEFITS
      finding: Missing. No person-level raw FRS variable has SPI OTHERINC semantics, and the miscellaneous pool cannot be split between MOTHINC and OTHERINC from source evidence.
      mass_implication: No separable mass estimate exists; the unresolved miscellaneous pool is 1.4650566% of certified-candidate FRS effective person mass.
      rationale: A union of heterogeneous residual fields would be a new proxy, not a retained source constituent.
      dependent_fence_ids: []
    - fence_id: frs_ossben_identifiable_subset
      constituents:
      - OSSBEN
      - ossben_identifiable_subset
      raw_sources_searched:
      - BENEFITS.BENAMT
      - BENEFITS.BENEFIT
      - BENEFITS.VAR2
      - BENEFITS codes 13, 16, 6, and 30
      finding: Incomplete. Carer's Allowance and contribution-based ESA form an identifiable subset, but code 6 mixes tax treatments and code 30 is an undifferentiated catch-all, so the complete taxable family cannot be emitted.
      mass_implication: 1.8045088% of certified-candidate FRS effective person mass carries the identifiable lower-bound subset; it is not full OSSBEN support.
      rationale: The retained column must remain explicitly named as a subset and cannot satisfy the full SPI concept.
      dependent_fence_ids: []
    - fence_id: frs_srp_regular_code5_subset
      constituents:
      - SRP
      - srp_regular_code5
      raw_sources_searched:
      - BENEFITS.BENAMT where BENEFIT == 5
      - BENEFITS codes 6 and 9
      finding: Incomplete. Code 5 supplies regular State Pension, but the FRS source does not identify the full SPI combination of State Pension lump sums and widow's pension; code 6 mixes benefits and code 9 is tax-free War Widow's Pension.
      mass_implication: 18.1567916% of certified-candidate FRS effective person mass carries regular code-5 State Pension; it is not complete SRP support.
      rationale: The retained column must remain explicitly named as a subset and cannot be reported as the full published state-pension measure.
      dependent_fence_ids: []
    - fence_id: full_frs_tei_band_unavailable
      constituents:
      - EPB
      - EXPS
      - TAXTERM
      - MOTHINC
      - OTHERINC
      - OSSBEN
      - SRP
      raw_sources_searched: []
      finding: The complete FRS TEI measure cannot be materialized from retained source constituents, so exact HMRC total-income band assignment is unavailable on the FRS channel.
      mass_implication: Every one of the 208 published facts is banded by total income and therefore depends on this unavailable like-for-like measure.
      rationale: 'A component-level subset does not imply a per-band lower bound: omitted income can move a taxpayer into or out of any non-overlapping published band. Biased partial bands are not emitted as estimates.'
      dependent_fence_ids:
      - frs_epb_source_absent
      - frs_exps_source_absent
      - frs_taxterm_source_absent
      - frs_mothinc_source_absent
      - frs_otherinc_source_absent
      - frs_ossben_identifiable_subset
      - frs_srp_regular_code5_subset
    fact_fence_id: full_frs_tei_band_unavailable
    blocked_dependency: hmrc_spi_assessable_income
    fail_on_unfenced_exclusion: true
    fail_on_fact_count_mismatch: true
    forbid_biased_estimate_or_delta: true
