- stage: frs_employment
  survey: Family Resources Survey 2023-24
  source: Department for Work and Pensions Family Resources Survey 2023-24, UK Data Service SN 9252 local licensed tabs.
  grain: person
  artifacts:
  - role: frs_table
    table: adult
    kind: licensed_microdata
    format: tab
    vintage: '2023_24'
    locator: adult.tab
    sha256: e09f9647d03585c81a528636028b2ed495f8f1fbcf64c5e7b4fe521b67367e06
    size_bytes: 35323384
    runtime_sha256_required: true
  operations:
  - kind: read_tables
    format: tab
    delimiter: "\t"
    lowercase_columns: true
    numeric_errors: coerce
    runtime_sha256_required: true
  - kind: map_coded_amounts
    scope: empstati employment status, mjobsect sector, and raw SIC division
  outputs:
  - employment_status
  - employment_sector
  - sic_industry_division
  nonnegative_outputs:
  - sic_industry_division
  notes: Ports FRS employment derivations. empstati code 11 preserves the incumbent truncated-map artifact as LONG_TERM_DISABLED, so OTHER_INACTIVE is not emitted; mjobsect and sic are direct-indexed and fail loudly if absent.
- stage: frs_council_tax
  survey: Family Resources Survey 2023-24
  source: Department for Work and Pensions Family Resources Survey 2023-24, UK Data Service SN 9252 local licensed tabs.
  grain: household
  artifacts:
  - role: frs_table
    table: househol
    kind: licensed_microdata
    format: tab
    vintage: '2023_24'
    locator: househol.tab
    sha256: 5fd26b8b675f33b3b30c9ac789a18da17de734790f77e00ded287d1c3a187b30
    size_bytes: 12387117
    runtime_sha256_required: true
  operations:
  - kind: read_tables
    format: tab
    delimiter: "\t"
    lowercase_columns: true
    numeric_errors: coerce
    runtime_sha256_required: true
  - kind: impute_cell_means
    cells:
    - gvtregno
    - ctband
    - adulth == 1
    donor_filter: raw ctannual > 0
    missing: raw ctannual < 0 or NaN
    value: Scottish-water-netted CTANNUAL
  outputs:
  - council_tax
  nonnegative_outputs:
  - council_tax
  notes: Re-reads raw househol.tab because spine council_tax_reported clips missing values. Scottish Water charges are netted before cell means; no-donor cells impute zero. The dead ct_mean.replace(-1, ...) branch is intentionally dropped.
- stage: frs_disability
  survey: Family Resources Survey 2023-24
  source: Department for Work and Pensions Family Resources Survey 2023-24, UK Data Service SN 9252 local licensed tabs plus policyengine-uk DWP parameters.
  grain: person
  artifacts: []
  operations:
  - kind: derive
    parameters: disability category thresholds from baseline.gov.dwp at Jan-1
  - kind: derive
    parameters: disability flags from gov.dwp at Jan-1
  outputs:
  - aa_category
  - dla_sc_category
  - dla_m_category
  - pip_m_category
  - pip_dl_category
  - is_disabled_for_benefits
  - is_enhanced_disabled_for_benefits
  - is_severely_disabled_for_benefits
  notes: Consumes E2 reported disability amount carriers. The five internal amount carriers are retained through E7 and stripped at E10; export allowlists stay fail-closed.
- stage: frs_education
  survey: Family Resources Survey 2023-24
  source: Department for Work and Pensions Family Resources Survey 2023-24, UK Data Service SN 9252 local licensed tabs.
  grain: person
  artifacts:
  - role: frs_table
    table: adult
    kind: licensed_microdata
    format: tab
    vintage: '2023_24'
    locator: adult.tab
    sha256: e09f9647d03585c81a528636028b2ed495f8f1fbcf64c5e7b4fe521b67367e06
    size_bytes: 35323384
    runtime_sha256_required: true
  - role: frs_table
    table: child
    kind: licensed_microdata
    format: tab
    vintage: '2023_24'
    locator: child.tab
    sha256: b5dc84fe8b002ee925e61fae23fed27b11537af9fb174f1d07d9cc1748b9702e
    size_bytes: 2913156
    runtime_sha256_required: true
  operations:
  - kind: read_tables
    format: tab
    delimiter: "\t"
    lowercase_columns: true
    numeric_errors: coerce
    runtime_sha256_required: true
  - kind: derive
    scope: current/highest education, QYP inputs, EMA cell-mean degenerate fills, and benefits-in-own-right flag
  - kind: impute_cell_means
    cells:
    - 'single cell: EMA participants (code == 1; adema/ademaamt pair, eduma/edumaamt when adema is absent; chema/chemaamt for children)'
    donor_filter: participants with non-negative reported amounts
    missing: participants with sentinel negative reported amounts
    value: donor-mean fill, floored at zero, annualized with 365.25 / 7
  outputs:
  - current_education
  - highest_education
  - is_in_non_advanced_education
  - is_in_approved_training
  - age_started_or_accepted_current_education_or_training
  - is_before_universal_credit_qualifying_young_person_terminal_date
  - adult_ema
  - child_ema
  - receives_benefits_in_own_right
  nonnegative_outputs:
  - adult_ema
  - child_ema
  - age_started_or_accepted_current_education_or_training
  notes: 'Ports the incumbent education cascade including its unreachable POST_SECONDARY branch order. EDUCQUAL_MAP carries the corrected highest-qualification codeframe (1 = Doctorate, descending) per the FRS 2023-24 data dictionary (UK Data Service SN 9367, DOI 10.5255/UKDA-SN-9367-2, adult table), corroborated against the raw aggregates and adopted as a signed difference (PR #703); an upstream defect report records the incumbent inversion. Code 87 is undocumented in the dictionary and falls to the default. EMA uses the shared weeks-in-year constant.'
- stage: frs_legacy_proxies
  survey: Family Resources Survey 2023-24
  source: Department for Work and Pensions Family Resources Survey 2023-24, UK Data Service SN 9252 local licensed tabs plus policyengine-uk DWP parameters.
  grain: person
  artifacts:
  - role: frs_table
    table: adult
    kind: licensed_microdata
    format: tab
    vintage: '2023_24'
    locator: adult.tab
    sha256: e09f9647d03585c81a528636028b2ed495f8f1fbcf64c5e7b4fe521b67367e06
    size_bytes: 35323384
    runtime_sha256_required: true
  operations:
  - kind: read_tables
    format: tab
    delimiter: "\t"
    lowercase_columns: true
    numeric_errors: coerce
    runtime_sha256_required: true
  - kind: materialize_rules_engine_predictors
    predictors:
    - state_pension_age
    consumed_only: true
  - kind: derive
    scope: legacy JSA and ESA claimant-state proxies
  outputs:
  - legacy_jobseeker_proxy
  - esa_health_condition_proxy
  - esa_support_group_proxy
  notes: The proxies are labels, not entitlement determinations. JSA hours compare against 16 * (365.25 / 7) on the E2 spine hours scale; state_pension_age is consumed but not persisted.
- stage: frs_education_grant_split
  survey: Family Resources Survey 2023-24
  source: Department for Work and Pensions Family Resources Survey 2023-24, UK Data Service SN 9252 local licensed tabs plus policyengine-uk DfE grant parameters.
  grain: person
  artifacts: []
  operations:
  - kind: materialize_rules_engine_predictors
    predictors:
    - childcare_grant
    - parents_learning_allowance
    - adult_dependants_grant
    consumed_only: true
  - kind: derive
    scope: proportional split of aggregate education_grants and DSA residual capacity
  outputs:
  - disabled_students_allowance_eligible_expenses
  rewrites:
  - education_grants
  nonnegative_outputs:
  - disabled_students_allowance_eligible_expenses
  notes: Runs before BRMA and always runs; both are signed inert differences for 2023-24. Pre-2025 DSA capacity is an aligned zero vector rather than an engine shape-sizing read.
- stage: frs_take_up
  survey: Family Resources Survey 2023-24
  source: Family Resources Survey 2023-24 reported receipt anchors plus sourced UK take-up contract rates.
  grain: benunit
  artifacts: []
  operations:
  - kind: aggregate_person_to_benunit
    method: any_positive
    consumed_only: true
    aggregates:
      child_benefit_reported_anchor: child_benefit_reported
      pension_credit_reported_anchor: pension_credit_reported
      universal_credit_reported_anchor: universal_credit_reported
  - kind: assign_binary_with_anchored_residual
    output: would_claim_child_benefit
    draw: would_claim_child_benefit
    rate_key: child_benefit
    anchor: child_benefit_reported_anchor
    seed: 0
  - kind: assign_binary_from_rate
    output: child_benefit_opts_out
    draw: child_benefit_opts_out
    rate_key: child_benefit_opts_out_rate
    seed: 0
  - kind: assign_binary_with_anchored_residual
    output: would_claim_pc
    draw: would_claim_pc
    rate_key: pension_credit
    anchor: pension_credit_reported_anchor
    seed: 0
  - kind: assign_binary_with_anchored_residual
    output: would_claim_uc
    draw: would_claim_uc
    rate_key: universal_credit
    anchor: universal_credit_reported_anchor
    seed: 0
  - kind: assign_binary_from_rate
    output: would_claim_tfc
    draw: would_claim_tfc
    rate_key: tax_free_childcare
    seed: 0
  - kind: assign_binary_from_rate
    output: would_claim_extended_childcare
    draw: would_claim_extended_childcare
    rate_key: extended_childcare
    seed: 0
  - kind: assign_binary_from_rate
    output: would_claim_universal_childcare
    draw: would_claim_universal_childcare
    rate_key: universal_childcare
    seed: 0
  - kind: assign_binary_from_rate
    output: would_claim_targeted_childcare
    draw: would_claim_targeted_childcare
    rate_key: targeted_childcare
    seed: 0
  - kind: assign_clipped_normal
    output: maximum_extended_childcare_hours_usage
    draw: maximum_extended_childcare_hours_usage
    distribution_key: maximum_extended_childcare_hours_usage
    seed: 0
  outputs:
  - would_claim_child_benefit
  - child_benefit_opts_out
  - would_claim_pc
  - would_claim_uc
  - would_claim_tfc
  - would_claim_extended_childcare
  - would_claim_universal_childcare
  - would_claim_targeted_childcare
  - maximum_extended_childcare_hours_usage
  nonnegative_outputs:
  - maximum_extended_childcare_hours_usage
  notes: Identity-keyed seed 0 streams replace the incumbent sequential take-up seed 100; salts are output variable names. Reported positive receipt anchors are transient and consumed only.
- stage: frs_person_draws
  survey: Family Resources Survey 2023-24
  source: Sourced UK take-up contract rates and identity-keyed deterministic draws.
  grain: person
  artifacts: []
  operations:
  - kind: assign_binary_from_rate
    output: would_claim_marriage_allowance
    draw: would_claim_marriage_allowance
    rate_key: marriage_allowance
    seed: 0
  - kind: assign_binary_from_banded_rates
    output: would_claim_scp
    draw: would_claim_scp
    band_column: age
    bands:
    - upper_exclusive: 6
      rate_key: scp_under_6
    - rate_key: scp_6_plus
    seed: 0
  - kind: assign_uniform_draw
    output: attends_private_school_random_draw
    seed: 0
  outputs:
  - would_claim_marriage_allowance
  - would_claim_scp
  - attends_private_school_random_draw
  nonnegative_outputs:
  - attends_private_school_random_draw
  notes: Identity-keyed seed 0 streams replace the incumbent sequential take-up seed 100; higher_earner_tie_break is intentionally not produced.
- stage: frs_household_draws
  survey: Family Resources Survey 2023-24
  source: Sourced UK stochastic contract rates and identity-keyed deterministic draws.
  grain: household
  artifacts: []
  operations:
  - kind: assign_binary_from_rate
    output: household_owns_tv
    draw: household_owns_tv
    rate_key: tv_ownership_rate
    seed: 0
  - kind: assign_binary_from_rate
    output: would_evade_tv_licence_fee
    draw: would_evade_tv_licence_fee
    rate_key: tv_licence_evasion_rate
    seed: 0
  - kind: assign_binary_from_rate
    output: main_residential_property_purchased_is_first_home
    draw: main_residential_property_purchased_is_first_home
    rate_key: first_time_buyer_rate
    seed: 0
  - kind: assign_binary_from_rate
    output: property_purchased
    draw: property_purchased
    rate_key: property_purchase_rate
    seed: 0
  outputs:
  - household_owns_tv
  - would_evade_tv_licence_fee
  - main_residential_property_purchased_is_first_home
  - property_purchased
  notes: Identity-keyed seed 0 streams replace the incumbent sequential take-up seed 100. TV evasion remains an independent draw, matching the incumbent reference share.
- stage: frs_brma
  survey: Family Resources Survey 2023-24
  source: Valuation Office Agency LHA list-of-rents count table and policyengine-uk LHA_category predictor.
  grain: household
  artifacts:
  - role: count_resource
    resource: brma_rent_counts.json
    kind: public_aggregated_counts
    format: json
  operations:
  - kind: materialize_rules_engine_predictors
    predictors:
    - LHA_category
    consumed_only: true
  - kind: sample_categorical_from_count_table
    output: brma
    count_resource: brma_rent_counts.json
    cell_columns:
    - region
    - LHA_category
    assignment_grain: benunit
    collapse_to: household
    collapse_method: uniform_member_pick
    seed: 0
  outputs:
  - brma
  notes: Identity-keyed seed 0 streams replace the incumbent BRMA seed 0 sequential generator. Household collapse uses salt brma:household_pick.
- stage: frs_hmrc_retained_leaves
  survey: Family Resources Survey 2023-24
  source: Department for Work and Pensions Family Resources Survey 2023-24 raw adult.tab and benefits.tab, caller-supplied local input
  grain: person
  artifacts: []
  operations:
  - kind: verify_certified_candidate
    artifact: base_candidate
    runtime_sha256_required: true
    fail_on_mismatch: true
  - kind: retain_adjudicated_frs_hmrc_leaves
    population: certified_microcosm_uk_candidate_base_channel
    source_vintage: 2023-24
    mapped_build_period: 2023
    annualization: weekly raw FRS amounts * (365.25 / 7)
    status: adjudicated_partial_replay
    retained_full_constituents:
      hmrc_spi_pay:
        spi_concept: PAY
        scope: full
        raw_sources:
        - ADULT.INEARNS
        formula: max(0, ADULT.INEARNS) * (365.25 / 7)
      hmrc_spi_unemployment_benefit_income:
        spi_concept: UBISJA
        scope: full
        raw_sources:
        - BENEFITS.BENEFIT=14:BENAMT
        - BENEFITS.BENEFIT=19:BENAMT
        formula: sum(BENAMT where BENEFIT in {14, 19}) * (365.25 / 7)
      hmrc_spi_incapacity_benefit_income:
        spi_concept: INCPBEN
        scope: full
        raw_sources:
        - BENEFITS.BENEFIT=17:BENAMT
        formula: sum(BENAMT where BENEFIT == 17) * (365.25 / 7)
        observed_support: structural zero in the audited 2023-24 FRS; retained so future vintages flow
    retained_named_subsets:
      ossben_identifiable_subset:
        spi_concept: OSSBEN
        raw_sources:
        - BENEFITS.BENEFIT=13:BENAMT
        - BENEFITS.BENEFIT=16,VAR2 in {1,3}:BENAMT
        formula: sum(BENAMT where BENEFIT == 13 or (BENEFIT == 16 and VAR2 in {1, 3})) * (365.25 / 7)
        scope: identifiable_subset
      srp_regular_code5:
        spi_concept: SRP
        raw_sources:
        - BENEFITS.BENEFIT=5:BENAMT
        formula: sum(BENAMT where BENEFIT == 5) * (365.25 / 7)
        scope: regular_code5_subset
    source_absent_full_constituents:
    - EPB
    - EXPS
    - TAXTERM
    - MOTHINC
    - OTHERINC
    full_concepts_forbidden_on_frs:
