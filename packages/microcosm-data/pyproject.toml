[project]
name = "microcosm-data"
version = "0.1.0"
description = "The distribution end of the microcosm stack: a registry of published microcosm populations and a loader that returns each as its policyengine engine dataset (one entry per country/year/variant, artifacts on the Hugging Face Hub)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PolicyEngine" }]
dependencies = [
    # Loading a published population needs only the Hub client; the country
    # engine is an optional extra so the base install stays light (no torch,
    # no engine). h5py is the artifact format and a cheap integrity check.
    "huggingface_hub>=0.20",
    "h5py>=3",
    "packaging>=24",
]

[project.scripts]
microcosm-publish-release = "microcosm.data.publish_cli:main"

# Country engines are optional: install the one(s) you load. The extra name is
# the country slug, matching the registry key and the loader's error message.
[project.optional-dependencies]
# Floor at the engine version verified to load the published artifact. 2.x is
# the SPM-1.0 line: 2.0.0 rejects derived SPM outputs (including the
# `in_poverty` alias) from stored datasets and requires observed county inputs,
# so a 1.x engine cannot load an artifact built for this floor and a 1.x
# artifact cannot be loaded by this engine. Cap below 3 to guard the next
# breaking dataset-schema major.
us = ["policyengine-us>=2.2.1,<3"]
# The UK artifact lives in a PRIVATE repo (UK Data Service licence): loads
# require an authenticated HF token with access. The loader surfaces the
# 401 with that explanation rather than retrying.
uk = ["policyengine-uk>=2.98.0"]

[project.urls]
Homepage = "https://microcosm.institute"
Repository = "https://github.com/PolicyEngine/microcosm"

[dependency-groups]
# Just the test runner — kept minimal so the workspace CI does not pull a
# country engine (policyengine-us is heavy) onto every shard's run. The live
# loader test is skipif-engine-absent, so it skips in CI and runs locally
# wherever the engine is installed.
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microcosm"]
